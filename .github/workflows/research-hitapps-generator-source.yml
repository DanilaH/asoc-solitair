name: Isolated reference generator inspection
on:
  push:
    branches: [research/hitapps-generator-native-20261126]
permissions:
  contents: read
jobs:
  azur:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acquire exact AZUR build if publicly available and execute known leaf
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          if ! curl --fail --location --silent --show-error --retry 0 --max-time 70 'https://d.apkpure.net/b/XAPK/com.solitaire.match.words?versionCode=244' -o "$tmp/azur.xapk"; then
            echo AZUR37_ACQUISITION_UNAVAILABLE
            exit 0
          fi
          python3 -m pip install --quiet --disable-pip-version-check 'unicorn==2.1.4' 'capstone==5.0.6'
          python3 - "$tmp/azur.xapk" <<'PY'
          import sys,zipfile,io,hashlib,struct,itertools,json
          from pathlib import Path
          p=Path(sys.argv[1])
          def sha(x):return hashlib.sha256(x).hexdigest()
          actual=sha(p.read_bytes())
          try:
           with zipfile.ZipFile(p) as z:
            with zipfile.ZipFile(io.BytesIO(z.read('com.solitaire.match.words.apk'))) as a:md=a.read('assets/bin/Data/Managed/Metadata/global-metadata.dat')
            with zipfile.ZipFile(io.BytesIO(z.read('config.arm64_v8a.apk'))) as a:e=a.read('lib/arm64-v8a/libil2cpp.so')
          except (KeyError,zipfile.BadZipFile) as exc:
           print('AZUR37_WRONG_PACKAGE_LAYOUT',actual,str(exc));sys.exit(0)
          h=[actual,sha(e),sha(md)]
          if h[1:]!=['27eb2e67ba00093ed575e16fc01a876a9e90fff8e53b504338047a4bf2c0d924','01ec4a9211a481353c4d660cda2f76fcb842f60e195ab5266d7a0ce4545be0a0']:
           print('AZUR37_WRONG_BUILD',json.dumps(h));sys.exit(0)
          print('AZUR37_EXACT_NATIVE_HASHES',json.dumps(h))
          from unicorn import Uc,UC_ARCH_ARM64,UC_MODE_ARM
          from unicorn.arm64_const import *
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          d=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          ph=struct.unpack_from('<Q',e,32)[0];sz,n=struct.unpack_from('<HH',e,54)
          seg=[]
          for i in range(n):
           typ,flags,fo,va,pa,filesz,memsz,align=struct.unpack_from('<II6Q',e,ph+i*sz)
           if typ==1:seg.append((fo,va,filesz))
          def off(a,n):
           for fo,v,sz in seg:
            if v<=a and a+n<=v+sz:return fo+a-v
           raise ValueError(hex(a))
          def run(a,b,flags):
           u=Uc(UC_ARCH_ARM64,UC_MODE_ARM);page=a&~4095
           u.mem_map(page,4096);u.mem_write(page,e[off(page,4096):off(page,4096)+4096])
           u.mem_map(0x11000000,0x10000);u.reg_write(UC_ARM64_REG_SP,0x1100f000);u.reg_write(UC_ARM64_REG_LR,0x11000000)
           u.reg_write(UC_ARM64_REG_X0,flags);u.reg_write(UC_ARM64_REG_X1,flags)
           u.emu_start(a,0x11000000,count=64)
           assert u.reg_read(UC_ARM64_REG_PC)==0x11000000
           return u.reg_read(UC_ARM64_REG_X0)
          a=0x26990dc;b=0x26990f8
          print('AZUR37_LEAF',json.dumps([[hex(x.address),x.mnemonic,x.op_str] for x in d.disasm(e[off(a,b-a):off(a,b-a)+b-a],a)]))
          rows=[]
          for v in itertools.product((0,1),repeat=5):
           flags=sum(k<<(8*i) for i,k in enumerate(v));got=run(a,b,flags)
           assert got==int(bool(v[0] and v[3] and not v[2])),(v,got)
           rows.append([*v,got])
          print('AZUR37_NATIVE_PRODUCTIVE',json.dumps(rows,separators=(',',':')))
          for label,a,b in [('commit',0x2698678,0x2698770),('commit-all',0x2698770,0x2698880),('grant',0x2698b84,0x2698f24),('build',0x2697554,0x2697630),('sink',0x2621a44,0x2621ad4)]:
           print('AZUR37_ANCHOR',json.dumps({'name':label,'start':hex(a),'end':hex(b),'facts':[[hex(x.address),x.mnemonic,x.op_str] for x in d.disasm(e[off(a,b-a):off(a,b-a)+b-a],a)]},separators=(',',':')))

          # Execute original bounded ARM64 arithmetic and branches with explicit synthetic memory.
          from unicorn import UC_HOOK_CODE
          B=0x11000000;OBJ=B+0x1000;TRACK=B+0x3000;STOP=B+0xf000
          def probe(a,stops,regs,fields,skips=None,count=200):
           u=Uc(UC_ARCH_ARM64,UC_MODE_ARM);pages=set()
           for v in [a,*stops]:
            if B<=v<B+0x10000:continue
            p=v&~4095
            if p not in pages:u.mem_map(p,4096);u.mem_write(p,e[off(p,4096):off(p,4096)+4096]);pages.add(p)
           u.mem_map(B,0x10000);u.reg_write(UC_ARM64_REG_SP,B+0xe000);u.reg_write(UC_ARM64_REG_LR,STOP)
           for p,v in fields.items():u.mem_write(p,struct.pack('<I',v&0xffffffff))
           for r,v in regs.items():u.reg_write(r,v&0xffffffffffffffff)
           skips=skips or {}
           def hook(uc,pc,size,user):
            if pc in stops:uc.emu_stop();return
            if pc in skips:
             v=skips[pc]
             if callable(v):v(uc)
             else:uc.reg_write(UC_ARM64_REG_PC,v)
           u.hook_add(UC_HOOK_CODE,hook);u.emu_start(a,STOP,count=count)
           pc=u.reg_read(UC_ARM64_REG_PC);assert pc in stops,(hex(a),hex(pc))
           return u,pc
          def w(u,r):return u.reg_read(r)&0xffffffff
          def rd(u,p):return struct.unpack('<I',u.mem_read(p,4))[0]
          rows=[]
          for kind,amount,pending in itertools.product(range(8),(-1,0,1,3,10),(0,2,9)):
           u,pc=probe(0x2698c1c,[0x2698c40,0x2698cd8,0x2698d7c],{UC_ARM64_REG_X20:OBJ,UC_ARM64_REG_X19:amount,UC_ARM64_REG_X21:kind},{OBJ+0x48:pending})
           out=rd(u,OBJ+0x48);branch={0x2698c40:1,0x2698cd8:2,0x2698d7c:0}[pc]
           exp=pending+amount if amount>=1 and kind==6 else pending
           assert (out,branch)==(exp,0 if amount<1 or kind==6 else 1 if kind==0 else 2)
           rows.append([kind,amount,pending,out,branch])
          print('AZUR38_GRANT',json.dumps(rows,separators=(',',':')))
          rows=[]
          for pending,request in itertools.product((0,1,2,5,10,30),(-1,0,1,3,10,30)):
           u,pc=probe(0x26986a8,[0x2698740,0x26986c0],{UC_ARM64_REG_X20:OBJ,UC_ARM64_REG_X19:request},{OBJ+0x48:pending})
           got=rd(u,OBJ+0x48);dispatch=int(pc==0x26986c0)
           assert (got,dispatch)==(max(0,pending-request) if request>0 else pending,int(request>0))
           rows.append([pending,request,got,dispatch])
          print('AZUR38_COMMIT',json.dumps(rows,separators=(',',':')))
          rows=[]
          for pending in (0,1,2,5,10,30):
           u,pc=probe(0x269879c,[0x269882c,0x26987ac],{UC_ARM64_REG_X20:OBJ},{OBJ+0x48:pending})
           got=rd(u,OBJ+0x48);dispatch=int(pc==0x26987ac);amount=w(u,UC_ARM64_REG_X19) if dispatch else 0
           assert (got,amount)==(0,pending)
           rows.append([pending,got,amount])
          print('AZUR38_ALL',json.dumps(rows,separators=(',',':')))
          rows=[]
          for lo,hi,requested,n in itertools.product((1,4),(8,10),range(0,13),(0,1,3,5,8)):
           u,pc=probe(0x26975a4,[0x26975e4,0x2697614],{UC_ARM64_REG_X0:hi,UC_ARM64_REG_X21:requested,UC_ARM64_REG_X22:lo,UC_ARM64_REG_X20:TRACK},{TRACK+0x18:n},skips={0x26975c8:0x26975d0,0x26975dc:0x26975e0})
           slots=w(u,UC_ARM64_REG_X21);idx=w(u,UC_ARM64_REG_X23) if pc==0x26975e4 else -1
           exp=max(lo,min(hi,requested));assert(slots,idx)==(exp,min(n-1,exp-lo) if n else -1)
           if not n:assert w(u,UC_ARM64_REG_X22)==0 and w(u,UC_ARM64_REG_X3)==1
           rows.append([lo,hi,requested,n,slots,idx])
          print('AZUR38_BUILD',json.dumps(rows,separators=(',',':')))
          for label,a,b in [('move-handler',0x269906c,0x26990dc),('add-progress',0x2698a24,0x2698b84),('buy-moves',0x26a92bc,0x26a936c),('complete-series',0x2698f24,0x269906c)]:
           print('AZUR38_ANCHOR',json.dumps({'name':label,'start':hex(a),'end':hex(b),'facts':[[hex(x.address),x.mnemonic,x.op_str] for x in d.disasm(e[off(a,b-a):off(a,b-a)+b-a],a)]},separators=(',',':')))

          rows=[]
          for unlocked,*flags in itertools.product((0,1),repeat=6):
           f=sum(v<<(8*i) for i,v in enumerate(flags))
           def unlock(u):
            u.reg_write(UC_ARM64_REG_X0,unlocked);u.reg_write(UC_ARM64_REG_PC,0x2699080)
           u,pc=probe(0x269906c,[STOP,0x2698f24,0x2698a24],{UC_ARM64_REG_X0:OBJ,UC_ARM64_REG_X1:f},{},skips={0x269907c:unlock})
           got={STOP:0,0x2698f24:1,0x2698a24:2}[pc]
           exp=0 if not unlocked else 1 if flags[1] and flags[4] else 2 if flags[0] and flags[3] and not flags[2] else 0
           assert got==exp
           if got==2:assert w(u,UC_ARM64_REG_X1)==1
           rows.append([unlocked,*flags,got])
          print('AZUR39_HANDLER',json.dumps(rows,separators=(',',':')))
          rows=[]
          for count,progress,amount in itertools.product((4,5,7,8),range(9),(-1,0,1,2,3,8)):
           if progress>=count:continue
           STAGE=B+0x4000
           # Start after the amount guard, with original stage reference and absent observer callbacks.
           def ref(u):
            u.mem_write(OBJ+0x38,struct.pack('<Q',STAGE))
            u.reg_write(UC_ARM64_REG_PC,0x2698a54)
           # Exercise actual loop with synthetic completion callback that records and resets the stage.
           completed=[0]
           def complete(u):
            completed[0]+=1
            u.mem_write(STAGE+0x14,struct.pack('<I',0))
            u.reg_write(UC_ARM64_REG_PC,0x2698ab0)
           u,pc=probe(0x2698a24,[STOP],{UC_ARM64_REG_X0:OBJ,UC_ARM64_REG_X1:amount},{STAGE+0x14:progress,STAGE+0x18:count},skips={0x2698a38:lambda u:(u.mem_write(OBJ+0x38,struct.pack('<Q',STAGE)),u.reg_write(UC_ARM64_REG_PC,0x2698a38+4),u.reg_write(UC_ARM64_REG_X8,STAGE)),0x2698aac:complete},count=500)
           got=rd(u,STAGE+0x14);n=completed[0];v=w(u,UC_ARM64_REG_X0)
           total=progress+max(0,amount)
           assert (got,n,v)==(total%count,total//count,int(total>=count)),(count,progress,amount,got,n,v)
           rows.append([count,progress,amount,got,n,v])
          print('AZUR39_PROGRESS',json.dumps(rows,separators=(',',':')))
          rows=[]
          for a,b,amount in itertools.product((0,1,20,100),(0,3,80),(-1,0,1,3,20)):
           u,pc=probe(0x26a9328,[0x26a93c8,0x26a9360],{UC_ARM64_REG_X19:OBJ,UC_ARM64_REG_X20:amount},{OBJ+0x10:a,OBJ+0x14:b},skips={0x26a9334:0x26a933c})
           got=[rd(u,OBJ+0x10),rd(u,OBJ+0x14)]
           assert got==[a+max(0,amount),b+max(0,amount)]
           rows.append([a,b,amount,*got])
          print('AZUR39_BUDGET',json.dumps(rows,separators=(',',':')))
          print('PASS_AZUR39_NATIVE')
          PY
