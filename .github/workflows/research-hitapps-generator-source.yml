           u=setup([(0x1c8414c,0x1c84158)]);wb(u,G+2,h);wb(u,G+6,act);args(u,G);run(u,0x1c8414c,0x1c84158,stops=(0x1c841a8,));gate=rr(u,UC_ARM_REG_PC)==0x1c84158
           if gate:
