            u=setup([(a,end)]);args(u,idx);run(u,a,end,stops=(fail,));got=int(rr(u,UC_ARM_REG_PC)==end);assert got==int(idx<0);pat.append([family,idx,got])
          print('PAT29',json.dumps(pat))
