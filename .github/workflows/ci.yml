name: Isolated Unico level asset research (not product CI)
on:
  push:
    branches: [research/unico-level-assets-20261128]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read only exact signed candidate local assets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --silent --show-error --retry 1 --max-time 120 'https://d.apkpure.net/b/XAPK/com.unicostudio.wordsolitaire?version=latest' -o "$tmp/source.xapk"
          echo '4cd372b97d14711bcd4dfbb3188919fdd6a98b86ec0645163c28424bc08113f7  '"$tmp/source.xapk" | sha256sum -c -
          python3 -m pip install --quiet --disable-pip-version-check 'UnityPy>=1.20,<2'
          mkdir -p .recording
          python3 - "$tmp/source.xapk" <<'PY'
          import collections, hashlib, json, io, re, struct, sys, zipfile, importlib.metadata, pathlib
          import UnityPy
          sha=lambda b:hashlib.sha256(b).hexdigest()
          z=zipfile.ZipFile(sys.argv[1]); mf=json.loads(z.read('manifest.json'))
          assert mf['package_name']=='com.unicostudio.wordsolitaire' and str(mf['version_code'])=='37' and mf['version_name']=='1.1.10'
          pin={'com.unicostudio.wordsolitaire.apk':'e4b15fa0327b2be7d13da88779674a3e4fc312234d467031cd8bc1695af06820','config.arm64_v8a.apk':'b7995bf3e689e98e083d95d7037659ea46d8ebb47c0205fa47cea85fc66675d5'}
          parts={}; stats=collections.Counter(); errors=collections.Counter(); rows=[]; names=[]; candidate_assets=[]; catalog=[]
          def n(k):return re.sub(r'[^a-z0-9]','',str(k).lower())
          fieldset=set('foundationcount maxmoves levelid generatenewseedonshuffle shuffleseed resolveddifficulty generaldifficulty data columns columncount tableau tableaucount stock stockcount categories category categoryid cards cardcount words wordsset words count size piles pilecount levels levelnumber levelindex leveltype difficulty moveslimit moves firstcolumncards foundation foundations groups items seed id text word image cardtype kind type layout deck slots order'.split())
          def shape(x,depth=0):
              if isinstance(x,dict):
                  return {'kind':'object','fieldCount':len(x),'fields':{k:shape(v,depth+1) for k,v in x.items() if n(k) in fieldset and depth<3}}
              if isinstance(x,list):
                  return {'kind':'array','count':len(x),'sampleShapes':[shape(v,depth+1) for v in x[:3]] if depth<3 else []}
              return {'kind':type(x).__name__}
          def safe_id(x):
              if isinstance(x,int) and not isinstance(x,bool):return x
              if isinstance(x,str) and re.fullmatch(r'(?i)(?:level[_ -]?)?[0-9]+',x):return x
              return {'hash':sha(str(x).encode())} if x is not None else None
          def walk(x,origin,depth=0):
              if depth>12:return
              if isinstance(x,dict):
                  fields={n(k):v for k,v in x.items()}
                  if ('maxmoves' in fields and 'foundationcount' in fields) or ('moveslimit' in fields and ('columns' in fields or 'tableau' in fields or 'categories' in fields)):
                      rec={'origin':origin,'levelId':safe_id(fields.get('levelid',fields.get('levelnumber'))),'numeric':{k:v for k,v in fields.items() if k in fieldset and isinstance(v,(int,float,bool))},'shape':shape(x)}
                      if 'data' in fields:rec['dataShape']=shape(fields['data'])
                      rows.append(rec);stats['levelLikeRecords']+=1
                  for k,v in x.items():
                      if isinstance(v,(list,dict)):walk(v,origin,depth+1)
                      elif isinstance(v,str) and len(v)<16_000_000 and v.lstrip().startswith(('{','[')) and re.search(r'max.?moves|foundation.?count|moves.?limit',v,re.I):
                          try:walk(json.loads(v),origin,depth+1)
                          except (ValueError,RecursionError):pass
              elif isinstance(x,list):
                  for v in x:walk(v,origin,depth+1)
          def textasset(raw,origin):
              if isinstance(raw,str):raw=raw.encode('utf-8','surrogateescape')
              if not isinstance(raw,bytes) or len(raw)>32_000_000:return
              try:s=raw.decode('utf-8-sig')
              except UnicodeDecodeError:return
              if not s.lstrip().startswith(('{','[')):return
              try:d=json.loads(s)
              except (ValueError,RecursionError):return
              stats['jsonParsed']+=1
              if isinstance(d,dict) and any(k.startswith('m_') and ('Catalog' in k or 'KeyData' in k or 'InternalIds' in k) for k in d):
                  ids=d.get('m_InternalIds',[])
                  catalog.append({'origin':origin,'internalIdCount':len(ids) if isinstance(ids,list) else None,'levelNamedIds':sum(bool(re.search(r'level|regular|daily',v,re.I)) for v in ids if isinstance(v,str)) if isinstance(ids,list) else None})
              walk(d,origin)
          for i in z.infolist():
              if not i.filename.endswith('.apk'):continue
              raw=z.read(i);h=sha(raw)
              assert h in pin.values(),'unexpected nested APK bytes'
              parts[i.filename]=h
              with zipfile.ZipFile(io.BytesIO(raw)) as a:
                  stats['apkMembers']+=len(a.infolist())
                  for f in a.infolist():
                      if not f.filename.startswith('assets/') or f.is_dir():continue
                      stats['assets']+=1
                      name=f.filename
                      if re.search(r'level|regular|daily|catalog',name,re.I):
                          names.append({'pathHash':sha(name.encode()),'bytes':f.file_size,'suffix':pathlib.Path(name).suffix,'kind':'level' if 'level' in name.lower() else 'catalog-or-other'})
                      if f.file_size<16 or f.file_size>240_000_000:continue
                      with a.open(f) as s:head=s.read(24)
                      isbundle=head.startswith((b'UnityFS',b'UnityRaw',b'UnityWeb'))
                      isasset=name.endswith(('.assets','.bundle')) or name.startswith('assets/bin/Data/') and pathlib.Path(name).suffix in ('','')
                      isjson=head.lstrip(b'\xef\xbb\xbf \t\r\n').startswith((b'{',b'['))
                      if not (isbundle or isasset or isjson):continue
                      b=a.read(f)
                      origin={'fileSha256':sha(b),'bytes':len(b),'nameHash':sha(name.encode())}
                      if isjson:textasset(b,origin);continue
                      if name.endswith(('.resS','.resource','.dll')):continue
                      stats['unityFilesAttempted']+=1
                      try:
                          env=UnityPy.load(b)
                          stats['unityFilesOpened']+=1
                          for obj in env.objects:
                              kind=obj.type.name
                              stats['objects:'+kind]+=1
                              try:
                                  if kind=='TextAsset':
                                      t=obj.read()
                                      nm=str(getattr(t,'m_Name',''))
                                      rr=getattr(t,'m_Script',None)
                                      o=dict(origin,objectId=obj.path_id,nameHash=sha(nm.encode()))
                                      if re.search(r'level|daily|regular|config',nm,re.I):
                                          candidate_assets.append({'origin':o,'nameShape':re.sub(r'[^0-9]+','_',nm)[:48],'kind':kind,'bytes':len(rr) if rr is not None else None})
                                      textasset(rr,o)
                                  elif kind=='MonoBehaviour' and obj.byte_size<=524288:
                                      try:
                                          d=obj.read_typetree()
                                          if isinstance(d,dict):walk(d,dict(origin,objectId=obj.path_id))
                                      except Exception:errors['mono-no-tree']+=1
                              except Exception as e:errors['obj:'+type(e).__name__]+=1
                          del env
                      except Exception as e:errors['file:'+type(e).__name__]+=1
          assert len(parts)==2 and set(parts.values())==set(pin.values())
          report={'tier':'SIGNED_PUBLIC_CANDIDATE_LOCAL_STATIC','xapkSha256':'4cd372b97d14711bcd4dfbb3188919fdd6a98b86ec0645163c28424bc08113f7','publisherTrust':'UNKNOWN','runtimeExecuted':False,'parts':parts,'unityPy':importlib.metadata.version('UnityPy'),'statistics':dict(stats),'errors':dict(errors),'levelRecords':rows,'levelNamedPaths':names,'levelNamedTextAssets':candidate_assets,'catalogSummaries':catalog}
          pathlib.Path('.recording/unico-level-assets.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print('SUMMARY',json.dumps({k:v for k,v in report.items() if k not in ('levelRecords','levelNamedPaths','levelNamedTextAssets','catalogSummaries')}))
          print('COUNTS',json.dumps({'rows':len(rows),'paths':len(names),'assets':len(candidate_assets),'catalogs':catalog,'firstRows':rows[:3]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unico-level-assets-numeric
          path: .recording/unico-level-assets.json
          if-no-files-found: error
