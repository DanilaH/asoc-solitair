name: Isolated reference generator inspection
on:
  push:
    branches: [research/hitapps-generator-native-20261126]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify original public build and inspect numeric source anchors
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --silent --show-error --retry 1 --max-time 100 'https://d.apkpure.net/b/XAPK/com.hitappsgames.wordsolitaire?versionCode=3742' -o "$tmp/source.xapk"
          python3 -m pip install --quiet --disable-pip-version-check 'unicorn==2.1.4' 'capstone==5.0.6'
          python3 - "$tmp/source.xapk" <<'PY'
          import hashlib,struct,sys,zipfile,io,re,bisect,json
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes()
          assert len(raw)==287832513 and hashlib.sha256(raw).hexdigest()=='22aaff3a6d5b70f217b8feb7348538f5ab3352d4e8c766406cbddcbcd71e49f0'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           with zipfile.ZipFile(io.BytesIO(z.read('com.hitappsgames.wordsolitaire.apk'))) as a: md=a.read('assets/bin/Data/Managed/Metadata/global-metadata.dat')
           with zipfile.ZipFile(io.BytesIO(z.read('config.armeabi_v7a.apk'))) as a: e=a.read('lib/armeabi-v7a/libil2cpp.so')
          assert hashlib.sha256(e).hexdigest()=='f25d9a988f6fa61eb201879f72c556a5875a4ac2c5f541670950589afbb51e26'
          assert hashlib.sha256(md).hexdigest()=='47e2db3a792411193b25ed90c590facebcb3af861834eca90cb8e433a8e14aca'
          assert struct.unpack_from('<II',md)==(0xfab11baf,31)
          print('ORIGINAL XAPK AND BOTH PRIVATE NATIVE HASHES MATCH')
          del raw
          ph=struct.unpack_from('<I',e,28)[0];step,num=struct.unpack_from('<HH',e,42)
          seg=[]
          for j in range(num):
           typ,fo,va,_,size,_,flags,_=struct.unpack_from('<8I',e,ph+j*step)
           if typ==1:seg.append((fo,va,size,flags))
          assert [va-fo for fo,va,_,_ in seg]==[0,0x4000,0x8000]
          def off(va,n=4):
           for fo,start,size,_ in seg:
            if start<=va and va+n<=start+size:return fo+va-start
           raise ValueError(hex(va))
          def va(fo):
           for start,v,size,_ in seg:
            if start<=fo<start+size:return v+fo-start
           raise ValueError(hex(fo))
          def word(a):return struct.unpack_from('<I',e,off(a))[0]
          S,SS=struct.unpack_from('<II',md,24);T,TS=struct.unpack_from('<II',md,160)
          M,MS=struct.unpack_from('<II',md,48);I,IS=struct.unpack_from('<II',md,168)
          F,FS=struct.unpack_from('<II',md,96);P,PS=struct.unpack_from('<II',md,88)
          def name(ix):
           if not 0<=ix<SS:return ''
           p=S+ix;return md[p:md.index(b'\0',p,S+SS)].decode()
          images={}
          wanted={}
          for j in range(IS//40):
           row=struct.unpack_from('<10I',md,I+40*j);im=name(row[0]);images[im]=row
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t)
            tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            if re.search(r'(SimulationController|SimulationHelper|StrategySystem|Bot.*System|Simulation.*System|Simulation.*Strategy|LevelDataHandler|LevelSimulationRunner|EasyDealsService|EasyDealsConfig|DynamicDifficultyConfig|SimulatorGameplayContextFactory|MockRemoteConfig)',tn,re.I):
             wanted.setdefault(im,[]).append((tn,tr))
          print('TARGET_IMAGES',list(wanted))
          entries={};records=[];tables={}
          for im,types in wanted.items():
           row=images[im];pos=e.find(im.encode()+b'\0')
           if pos<0:print('NO_MODULE_STRING',im);continue
           marker=struct.pack('<I',va(pos));found=[]
           for fo,v,size,_ in seg[1:]:
            data=e[fo:fo+size];j=-1
            while (j:=data.find(marker,j+1))>=0:
             if j+12>size:continue
             n,p=struct.unpack_from('<II',data,j+4)
             if not 0<n<25000:continue
             try: ptrs=struct.unpack_from('<%dI'%n,e,off(p,n*4))
             except (ValueError,struct.error):continue
             if all(a==0 or 0x148b0b0<=a<0x6a167d0 for a in ptrs):found.append((v+j,n,p,ptrs))
           if len(found)!=1:print('AMBIGUOUS_MODULE',im,len(found));continue
           descriptor,n,table,ptrs=found[0];tables[im]=[hex(descriptor),n,hex(table)]
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t);tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            for i in range(tr[9],tr[9]+(tr[16]&65535)):
             mr=struct.unpack_from('<7I4H',md,M+36*i);rid=mr[6]&0xffffff
             if not 0<rid<=n:continue
             a=ptrs[rid-1];mn=name(mr[0])
             rec={'image':im,'type':tn,'method':mn,'rid':rid,'rva':hex(a),'parameters':[name(struct.unpack_from('<I',md,P+12*(mr[4]+k))[0]) for k in range(mr[-1])]}
             if a:entries.setdefault(a,[]).append(rec)
             if any(tn==x[0] for x in types):records.append(rec)
          print('MODULES',json.dumps(tables))
          # Numeric metadata and control-flow facts only, no original assets,
          # method bodies, native binaries, credentials or private data.
          for r in records:
           if r['rva']=='0x0':continue
           if re.search(r'SimulationController|SimulationHelper|StrategySystem|Bot.*System|Simulation.*System|Simulation.*Strategy',r['type'],re.I) or r['method'] in ['PlaceCategoryPairOnStack','PlaceCategoryPairsOnUniqueStacks','DistributePuzzleCards','ApplyLockers','ApplyFrozenCards','ApplyBoundCards','Evaluate','GetStepsLimit','Run','ShuffleLevelWithSeed']:
            print('METHOD',json.dumps(r,separators=(',',':')))
          starts=sorted(entries)
          targets=[r for r in records if r['rva']!='0x0' and (r['type'].endswith('SimulationController') or re.search(r'StrategySystem|Simulation.*System|Bot.*System',r['type'],re.I) or r['method'] in ['PlaceCategoryPairOnStack','PlaceCategoryPairsOnUniqueStacks','DistributePuzzleCards','ApplyLockers','ApplyFrozenCards','ApplyBoundCards','Evaluate'])]
          for r in targets[:0]:
           a=int(r['rva'],16);j=bisect.bisect_right(starts,a);end=min(starts[j] if j<len(starts) else a+512,a+2400)
           calls=[];branches=[];immediates=[]
           for pc in range(a,end,4):
            op=word(pc);cond=op>>28
            if (op&0x0e000000)==0x0a000000 and cond!=15:
             delta=((op&0xffffff)^0x800000)-0x800000;dst=pc+8+4*delta
             if op&0x01000000:
              names=[x['type']+'.'+x['method'] for x in entries.get(dst,[])]
              calls.append([hex(pc),hex(dst),names[:3],cond])
             elif cond<14:
              branches.append([hex(pc),cond,hex(dst)])
            # Record only CMP immediate anchors: condition, tested register, decoded integer.
            elif op&0x0ff0f000==0x03500000:
             imm=op&255;rot=((op>>8)&15)*2
             if rot:imm=((imm>>rot)|(imm<<(32-rot)))&0xffffffff
             immediates.append([hex(pc),(op>>16)&15,imm,cond])
           print('FLOW',json.dumps({'method':r['type']+'.'+r['method'],'rva':r['rva'],'boundedEnd':hex(end),'calls':calls[:60],'conditionalBranches':branches[:40],'cmpImmediate':immediates[:35]},separators=(',',':')))

          def branch(pc):
           w=word(pc)
           return pc+8+4*(((w&0xffffff)^0x800000)-0x800000) if w&0xe000000==0xa000000 and w>>28!=15 else None
          def operand2(op):
           if op&(1<<25):
            rot=((op>>8)&15)*2;imm=op&255
            return ((imm>>rot)|(imm<<(32-rot)))&0xffffffff if rot else imm
           return ['r',op&15,'shift',(op>>5)&3,(op>>7)&31,'rs',(op>>8)&15 if op&16 else None]
          def fact(pc):
           op=word(pc);c=op>>28
           if (dst:=branch(pc)) is not None:return [hex(pc),'call' if op&0x1000000 else 'branch',c,hex(dst)]
           if op&0x0c000000==0x04000000 and not op&0x02000000:return [hex(pc),'read' if op&0x100000 else 'write',c,(op>>12)&15,(op>>16)&15,(op&4095)*(1 if op&0x800000 else -1),'byte' if op&0x400000 else 'word']
           if op&0x0e000090==0x00000090 and op&0x60 and op&0x400000:return [hex(pc),'readHalf' if op&0x100000 else 'writeHalf',c,(op>>12)&15,(op>>16)&15,(((op>>4)&240)|(op&15))*(1 if op&0x800000 else -1),(op>>5)&3]
           if op&0x0c000000==0 and (op&0x0e000090)!=0x00000090:return [hex(pc),'alu',c,(op>>21)&15,(op>>12)&15,(op>>16)&15,operand2(op),bool(op&0x100000)]
           return None
          def equivalent(a,b):
           u,w=word(a),word(b)
           if u==w:return True
           ba,bb=branch(a),branch(b)
           if ba is not None and bb is not None and (u&0xff000000)==(w&0xff000000) and (ba==bb or ba-a==bb-b):return True
           if u&0x0f7f0000==0x051f0000 and w&0x0f7f0000==0x051f0000 and u&0xfffff000==w&0xfffff000:return True
           if u&0x0fef0000==0x028f0000 and w&0x0fef0000==0x028f0000 and u&0xfffff000==w&0xfffff000:return True
           return False
          # Execute original feature-authoring helpers against synthetic DTOs.
          from unicorn import Uc,UC_ARCH_ARM,UC_MODE_ARM,UC_HOOK_CODE
          from unicorn.arm_const import *
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM
          import itertools,collections
          dis=Cs(CS_ARCH_ARM,CS_MODE_ARM)
          def method_end(a):return starts[bisect.bisect_right(starts,a)]
          def imm(w):return ((w>>4)&0xf000)|(w&0xfff)
          def veneer(a):
           w,x,y,z=[word(a+4*i) for i in range(4)]
           if w&0xfff0f000==0xe300c000 and x&0xfff0f000==0xe340c000 and y==0xe08cc00f and z==0xe12fff1c:
            return (a+16+imm(w)+(imm(x)<<16))&0xffffffff
           if w&0xff000000==0xea000000:return a+8+4*(((w&0xffffff)^0x800000)-0x800000)
           return None
          comparison=veneer(0x2b4a784)
          print('COMPARE13',hex(comparison) if comparison else None)
          assert comparison
          row=images['mscorlib.dll'];p=e.find(b'mscorlib.dll\0');marker=struct.pack('<I',va(p));found=[]
          for fo,v,size,_ in seg[1:]:
           mem=e[fo:fo+size];j=-1
           while (j:=mem.find(marker,j+1))>=0:
            if j+12>size:continue
            n,p=struct.unpack_from('<II',mem,j+4)
            if not 0<n<60000:continue
            try: ptrs=struct.unpack_from('<%dI'%n,e,off(p,n*4))
            except (ValueError,struct.error):continue
            if all(a==0 or 0x148b0b0<=a<0x6a167d0 for a in ptrs):found.append(ptrs)
          assert len(found)==1
          ptrs=found[0];names=[]
          for t in range(row[2],row[2]+row[3]):
           tr=struct.unpack_from('<22I',md,T+88*t);tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
           for i in range(tr[9],tr[9]+(tr[16]&65535)):
            mr=struct.unpack_from('<7I4H',md,M+36*i);rid=mr[6]&0xffffff
            if 0<rid<=len(ptrs) and ptrs[rid-1]==comparison:names.append(tn+'.'+name(mr[0]))
          print('COMPARE_METHOD13',json.dumps(names))
          assert len(names)==1 and names[0] in ('System.String.op_Inequality','System.String.op_Equality'),names
          # Synthetic strings are interned distinct tokens. Only the identified string
          # operator is replaced by an exact equality/inequality result.
          NOT_EQUAL=names[0].endswith('op_Inequality')
          BASE=0x11000000;STOP=BASE+0xf0000
          def make_card(kind=1,cat=1,col=0,pos=0,key=0,locker=0,ice=0,puzzle=0,order=0,gold=0,bound=0,scissors=0):
           buf=bytearray(80)
           struct.pack_into('<i',buf,12,puzzle);struct.pack_into('<i',buf,16,order)
           struct.pack_into('<I',buf,24,BASE+0x80000+4*cat)
           struct.pack_into('<ii',buf,36,pos,col)
           buf[52]=kind;buf[53]=2;buf[56]=bound;buf[57]=scissors;buf[58]=key;buf[59]=locker;buf[60]=gold
           struct.pack_into('<H',buf,62,ice)
           return bytes(buf)
          def emulate(a,args,objects,arrays=(),reads=()):
           u=Uc(UC_ARCH_ARM,UC_MODE_ARM)
           # Only map source helper ranges, not original executable wholesale.
           page=0x1d39000;end=0x1d3bd000
           # map actual page interval around authoring helper cluster
           start=0x1d39000;limit=0x1d3c000
           u.mem_map(start,limit-start);u.mem_write(start,e[off(start,limit-start):off(start,limit-start)+limit-start])
           u.mem_map(BASE,0x100000)
           for ptr,raw in objects:u.mem_write(ptr,raw)
           for ptr,items,isbool in arrays:
            u.mem_write(ptr+12,struct.pack('<I',len(items)))
            u.mem_write(ptr+16,bytes(items) if isbool else struct.pack('<%dI'%len(items),*items))
           # string operator veneer call is intercepted before original runtime.
           vpage=0x2b4a784&~4095;u.mem_map(vpage,4096)
           # Runtime errors must not be silently bypassed.
           rtpage=0x1a26000;u.mem_map(rtpage,4096)
           rgs=[UC_ARM_REG_R0,UC_ARM_REG_R1,UC_ARM_REG_R2,UC_ARM_REG_R3]
           for r,x in zip(rgs,args):u.reg_write(r,x&0xffffffff)
           sp=BASE+0xe0000;u.reg_write(UC_ARM_REG_SP,sp);u.reg_write(UC_ARM_REG_LR,STOP)
           for i,x in enumerate(args[4:]):u.mem_write(sp+4*i,struct.pack('<I',x&0xffffffff))
           calls=[]
           def hook(uc,pc,size,user):
            if pc==0x2b4a784:
             a,b=uc.reg_read(UC_ARM_REG_R0),uc.reg_read(UC_ARM_REG_R1)
             val=(a!=b) if NOT_EQUAL else (a==b)
             uc.reg_write(UC_ARM_REG_R0,int(val));uc.reg_write(UC_ARM_REG_PC,uc.reg_read(UC_ARM_REG_LR));calls.append('category-compare')
            elif not start<=pc<limit:raise RuntimeError('unexpected native target '+hex(pc))
           u.hook_add(UC_HOOK_CODE,hook)
           u.emu_start(a,STOP,count=15000)
           assert u.reg_read(UC_ARM_REG_PC)==STOP,hex(u.reg_read(UC_ARM_REG_PC))
           return u.reg_read(UC_ARM_REG_R0),[bytes(u.mem_read(ptr,n)) for ptr,n in reads],calls
          C1=BASE+0x1000;C2=BASE+0x1100
          # HasOtherFeature, CanCarryScissors and CanBeBound: one-field and exhaustive
          # combinations including prior bound/scissors/key fields.
          tested=collections.Counter();errors=[]
          for key,locker,ice,puzzle,order,gold,bound,scissors in itertools.product(range(2),repeat=8):
           card=make_card(key=key,locker=locker,ice=ice,puzzle=puzzle,order=order,gold=gold,bound=bound,scissors=scissors)
           actual,_,_=emulate(0x1d3bb9c,[C1,0],[(C1,card)])
           expected=bool(locker or ice or puzzle>0 or order>0 or gold)
           if actual!=expected:errors.append(('otherFeature',key,locker,ice,puzzle,order,gold,bound,scissors,actual,expected))
           tested['otherFeature']+=1
           actual,_,_=emulate(0x1d3b9dc,[C1,0],[(C1,card)])
           if actual!=(key==0):errors.append(('scissors',key,actual))
           tested['scissors']+=1
          for ka,kb,ca,cb,fa,fb in itertools.product((0,1,3),(0,1,4),(1,2),(1,2),(0,1),(0,1)):
           a=make_card(kind=ka,cat=ca,ice=fa);b=make_card(kind=kb,cat=cb,ice=fb)
           actual,_,_=emulate(0x1d3b95c,[C1,C2,0],[(C1,a),(C2,b)])
           expected=ka==kb==1 and ca!=cb and not(fa or fb)
           if actual!=expected:errors.append(('bound',ka,kb,ca,cb,fa,fb,actual,expected))
           tested['bound']+=1
          for ca,pa,cb,pb in itertools.product(range(3),range(3),range(3),range(3)):
           a=make_card(col=ca,pos=pa);b=make_card(col=cb,pos=pb)
           actual,_,_=emulate(0x1d3bbf0,[C1,C2,0],[(C1,a),(C2,b)])
           expected=(ca,pa)<(cb,pb)
           if actual!=expected:errors.append(('earlier',ca,pa,cb,pb,actual,expected))
           tested['earlier']+=1
          print('LEAF13',json.dumps({'counts':dict(tested),'mismatches':len(errors),'examples':errors[:8]}))
          # No failed model assertion silently converted into source parity.
          assert not errors
          # Exercise original nearest-kept and balanced-pattern helpers on synthetic arrays.
          AR=BASE+0x3000;KEEP=BASE+0x4000
          coords=[(0,0),(0,1),(0,2),(1,0),(1,1),(2,0)]
          cards=[BASE+0x5000+i*0x100 for i in range(len(coords))]
          objects=[(p,make_card(col=c,pos=s)) for p,(c,s) in zip(cards,coords)]
          out=[]
          for origin in range(len(coords)):
           for mask in (0,1,3,10,21,42,63):
            flags=[(mask>>j)&1 for j in range(len(coords))]
            ret,read,cl=emulate(0x1d3ba00,[AR,KEEP,len(cards),cards[origin]],objects,[(AR,cards,False),(KEEP,flags,True)],[(KEEP+16,len(cards))])
            after=list(read[0]);dropped=[j for j,(x,y) in enumerate(zip(flags,after)) if x and not y]
            assert len(dropped)==min(1,sum(flags))
            out.append({'origin':origin,'mask':mask,'dropped':dropped})
          print('NEAREST13',json.dumps({'coordinates':coords,'rows':out},separators=(',',':')))
          U=BASE+0x10000;L=BASE+0x11000;S=BASE+0x12000;KU=BASE+0x13000;KS=BASE+0x14000
          # Different coordinates avoid accidental reference collisions. Each pair
          # independently has or lacks permission, each scissors card has or lacks key.
          balance=[]
          for n in (1,2,3):
           ps=[BASE+0x20000+0x100*i for i in range(n*3)]
           for pm in range(1<<n):
            for sm in range(1<<n):
             objects=[]
             for i in range(n):
              objects.extend([(ps[i],make_card(cat=1,col=i,pos=2)),(ps[n+i],make_card(cat=2 if pm>>i&1 else 1,col=i,pos=1)),(ps[2*n+i],make_card(key=0 if sm>>i&1 else 1,col=(i+1)%n,pos=0))])
             arrays=[(U,ps[:n],False),(L,ps[n:2*n],False),(S,ps[2*n:],False),(KU,[0]*n,True),(KS,[0]*n,True)]
             ret,read,cl=emulate(0x1d39028,[U,L,S,KU,KS,n,0],objects,arrays,[(KU+16,n),(KS+16,n)])
             balance.append({'n':n,'pairMask':pm,'scissorsMask':sm,'keptPairs':list(read[0]),'keptScissors':list(read[1]),'result':ret})
          print('BALANCE13',json.dumps(balance,separators=(',',':')))
          print('PASS_SHA_PINNED_SPECIAL_HELPERS13')
          PY
