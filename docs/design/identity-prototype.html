.helper b{border-color:#ffe2cf;background:linear-gradient(#f4c09f,#d9947b);color:#734f46}
.helper:after{color:#c1d5cd}.ad-reserve{background:#123f4b44;color:#82aeb0}.toast{background:#194650da;border-color:#b1cbc64d;color:#f8e5c7}
.overlay{background:#132a38b8}.pause-card,.sub-card{background:#fff9ee;border-color:#fff8e9;box-shadow:inset 0 0 0 3px #dddcd7,0 5px 0 #9eaaa9;border-radius:25px}
.pause-card h2,.sub-card h2{color:#496a74;font-weight:900}.close{color:#d89b83}
.pause-action{background:linear-gradient(#fffef8,#edf0f5);border-color:#fffdf5;box-shadow:0 4px 0 #c3cedb,0 5px 0 #adbec8;color:#657c85}
.pause-action svg{color:#83a8c9}.pause-action.restart svg{color:#a2a2c7}.pause-action.looks svg{color:#d7b17e}
.toggles button{background:linear-gradient(#c2d9d5,#92bebc);border-color:#f9faf4;box-shadow:0 4px 0 #adbecb;color:#fffef0}.toggles svg{filter:drop-shadow(0 2px 0 #719da0)}

.ink{background:radial-gradient(ellipse at 45% 30%,#73799e,#454b70 85%)!important}.ink .deck-card,.ink .strip.back{background-color:#9690bf}.ink .moves-flag{background:linear-gradient(#e5e1ef,#c5c4dc);color:#626385}.ink .budget-track{background:#b3b2ca}
@media(max-height:680px){.brand-scene{top:29%;transform:scale(.9)}.brand-scene .brand-main{font-size:27px}.moves-flag{height:77px}.category-progress{bottom:8px;gap:3px}}

<nav class="toolbar" aria-label="Экраны макета"><button data-view="home" aria-pressed="true">Главный</button><button data-view="game" aria-pressed="false">Поле</button><button data-view="pause" aria-pressed="false">Пауза</button></nav>

<script>
(()=>{const root=document.getElementById('phone'),home=document.getElementById('home-view'),game=document.getElementById('game-view'),pause=document.getElementById('pause-view'),sub=document.getElementById('sub-view'),content=document.getElementById('sub-content');let active='home',timer;
const icon=n=>`<svg><use href="#ic-${n}"/></svg>`;
let hintAnimation;function clearHintDemo(){hintAnimation?.cancel();document.getElementById('hint-arrow').hidden=true}
function close(){clearHintDemo();pause.hidden=true;sub.hidden=true;syncTabs()}
function syncTabs(){document.querySelectorAll('.toolbar [data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===(!pause.hidden?'pause':active))))}
function view(name){close();if(name==='pause'){active='game';home.hidden=true;game.hidden=false;pause.hidden=false}else{active=name;home.hidden=name!=='home';game.hidden=name!=='game'}syncTabs()}
function show(name){clearHintDemo();if(name==='pause'){pause.hidden=false;syncTabs();return}let body='';
if(name==='levels'){body='<h2>Уровни</h2><p>Первые связи · 1–20</p><div class="level-grid">'+Array.from({length:20},(_,i)=>`<button ${i>16?'disabled':''} class="${i<16?'done':i===16?'current':''}" data-level="${i+1}">${i+1}</button>`).join('')+'</div><p>Пройдено 16 из 80 уровней</p>'}
if(name==='daily'){body='<h2>Задание дня</h2><p>10 ноября · одна раздача на день</p><div class="calendar-grid">'+Array.from({length:14},(_,i)=>`<span class="${i===9?'today':''}">${i+1}</span>`).join('')+'</div><button class="play" data-enter-daily>Играть</button>'}
if(name==='cycle'){body='<h2>Пять побед</h2><div style="text-align:center;font-size:32px;color:#edbd43">★ ★ ★ ☆ ☆</div><p>Ещё две новые победы<br>до монет и подсказки.</p><button class="play" data-sub-close>Понятно</button>'}
if(name==='looks'){body='<h2>Ваш стол</h2><div class="look-options"><button aria-pressed="true" data-look="green">Сукно</button><button aria-pressed="false" data-look="ink">Чернила</button></div><p>Рубашка «Классика»<br>Колода сверху справа</p><button class="play" data-sub-close>Готово</button>'}
if(name==='helpers'){body='<h2>Помощники</h2><p>109 монет</p><button class="pause-action" data-tip="Подсказка стоит 100 монет">'+icon('hint')+'Подсказка · 100</button><button class="pause-action" data-tip="Отмена стоит 60 монет">'+icon('undo')+'Отмена · 60</button><p>Запас помощников можно пополнять<br>за игровые монеты.</p>'}
if(name==='restart'){body='<h2>Начать заново?</h2><p>Карты вернутся на исходные места.<br>Отметки пяти побед сбросятся.</p><button class="play" data-sub-close>Остаться в игре</button>'}
content.innerHTML=body;sub.hidden=false}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)view(b.dataset.view);else if(b.dataset.open)show(b.dataset.open);else if(b.hasAttribute('data-close'))close();else if(b.hasAttribute('data-sub-close'))sub.hidden=true;else if(b.hasAttribute('data-level')||b.hasAttribute('data-enter-daily'))view('game');else if(b.dataset.look){game.classList.toggle('ink',b.dataset.look==='ink');content.querySelectorAll('[data-look]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}else if(b.closest('.toggles'))b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true'));else if(b.dataset.tip){const t=document.getElementById('toast');t.textContent=b.dataset.tip;t.classList.add('visible');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('visible'),1700)}});
document.getElementById('hint-demo').addEventListener('click',()=>{const a=document.getElementById('hint-arrow');clearHintDemo();a.hidden=false;hintAnimation=a.animate([{transform:'translateY(20px)',opacity:0},{transform:'translateY(-15px)',opacity:1},{transform:'translateY(-35px)',opacity:0}],{duration:900,iterations:2});hintAnimation.onfinish=()=>a.hidden=true});
const params=new URLSearchParams(location.search);if(params.get('bare')==='1')document.body.classList.add('bare');const query=params.get('view');if(query)view(query);window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script></body></html>
