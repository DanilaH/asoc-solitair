name: Verify and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore the accepted pinned dependency cache without writing private source back
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.npm
          key: node-cache-Linux-x64-npm-a4df24577ed48de6d871f0577006637c44d25e4ee405b275d4a7b579b77d534b
      - name: Verify all referenced source systems are represented in the real consumer roadmap
        run: node tools/qa/verify-porting-ledger.mjs
      - name: Verify autonomous 115-feature 38-packet developer queue
        run: node tools/qa/verify-delivery-queue.mjs
      - run: node --test tests/infrastructure/*.test.mjs
      - name: Report legacy published-passport choice evidence (non-blocking quality warning)
        run: node tools/qa/audit-c8-decision-evidence.mjs
      - run: node tools/install-dependencies.mjs
        env:
          MINI_GAMES_KIT_READ_TOKEN: ${{ secrets.MINI_GAMES_KIT_READ_TOKEN }}
          ASOC_KIT_OFFLINE_CACHE: '1'
      - run: npm run check
      - name: Research Q1b full C8 decision continuations and witness-relative route cost
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'audit/c8-q1b-')
        env:
          VITE_CONTENT8_PREVIEW: '1'
        run: |
          npm run qa:campaign-decisions
          node tools/qa/summarize-c8-route-cost.mjs
      - name: Research Q1c finite-budget comparison and deeper unknown transfer probes
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'audit/c8-q1c-')
        env:
          VITE_CONTENT8_PREVIEW: '1'
        run: |
          npm run qa:campaign-decisions
          node tools/qa/summarize-c8-route-cost.mjs
          npm run qa:decision-cost
          npm run qa:decision-deep
      - run: npm run qa:hitapps-equality
      - run: npm run qa:rules
      - run: npm run content:azur-preset
      - run: npm run qa:content8
      - run: npm run qa:content7
      - run: npm run qa:opening
      - run: npm run qa:prototypes:build
      - run: npm run qa:prototypes:validate
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:layout
      - name: Check the compact result action before the full browser suite
        run: npx playwright test tests/browser/ui-coherence.spec.ts --grep 'dialog actions stay reachable before scroll at 320x480'
      - run: npm run test:browser
      - run: npm run qa:content7
        env:
          C7_REQUIRE_UI: '1'
      - name: Verify the integrated profile through the campaign UI
        env:
          VITE_ASOC_PROFILE: c8-release-v1
          ASOC_AD_MODE: disabled
        run: |
          npm run build
          npm run test:browser -- tests/browser/integrated-release.spec.ts tests/browser/mvp-cohesion-core.spec.ts tests/browser/mvp-cohesion-retention.spec.ts tests/browser/mvp-cohesion-shuffle.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            .recording/layout-audit/
            .recording/content7-ui/
            .recording/content7-recordings/
            .authoring/content8/campaign-decisions.json
            .authoring/content8/campaign-decision-cost.json
            .authoring/content8/campaign-unknown-transfer-deep.json
          retention-days: 7
  previews:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore the accepted pinned dependency cache without writing private source back
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.npm
          key: node-cache-Linux-x64-npm-a4df24577ed48de6d871f0577006637c44d25e4ee405b275d4a7b579b77d534b
      - run: node tools/install-dependencies.mjs
        env:
          MINI_GAMES_KIT_READ_TOKEN: ${{ secrets.MINI_GAMES_KIT_READ_TOKEN }}
          ASOC_KIT_OFFLINE_CACHE: '1'
      - run: npx playwright install --with-deps chromium
      - name: Verify the Content 8 preview with actual touch input
        if: startsWith(github.head_ref || github.ref_name, 'feat/c8-') || startsWith(github.head_ref || github.ref_name, 'audit/c8-') || startsWith(github.head_ref || github.ref_name, 'docs/c8-') || github.base_ref == 'feat/c8-onboarding-dealer-20261119'
        env:
          VITE_CONTENT8_PREVIEW: '1'
          VITE_CONTENT8_FROZEN: ${{ startsWith(github.head_ref || github.ref_name, 'feat/c8-p10-') && '1' || '0' }}
          VITE_CONTENT8_BOUND: ${{ startsWith(github.head_ref || github.ref_name, 'feat/c8-p11-') && '1' || '0' }}
          VITE_CONTENT8_BEYOND80: ${{ (startsWith(github.head_ref || github.ref_name, 'feat/c8-p33-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-p34-')) && '1' || '0' }}
          VITE_CONTENT8_LOCALE: ${{ startsWith(github.head_ref || github.ref_name, 'feat/c8-p34-') && '1' || '0' }}
          VITE_CONTENT8_DAILY_TASKS: ${{ (startsWith(github.head_ref || github.ref_name, 'feat/c8-p28-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-ux-wallet-progress-')) && '1' || '0' }}
          VITE_CONTENT8_PICTURE: ${{ startsWith(github.head_ref || github.ref_name, 'feat/c8-p27-') && '1' || '0' }}
          VITE_CONTENT8_REWARD_OFFERS: ${{ startsWith(github.head_ref || github.ref_name, 'feat/c8-p20-') && '1' || '0' }}
          VITE_CONTENT8_SPECIAL: ${{ startsWith(github.head_ref || github.ref_name, 'feat/c8-p12-') && 'puzzle' || startsWith(github.head_ref || github.ref_name, 'feat/c8-p13-') && 'gold' || startsWith(github.head_ref || github.ref_name, 'feat/c8-p14-') && 'starter' || startsWith(github.head_ref || github.ref_name, 'feat/c8-p16-') && 'shuffle' || '' }}
        run: |
          npm run build
          npx playwright test tests/browser/content8-core.spec.ts --output=test-results/content8-core
      - name: Verify wallet and weekly progress in the UX preview
        if: startsWith(github.head_ref || github.ref_name, 'feat/c8-ux-wallet-progress-')
        env:
          VITE_CONTENT8_PREVIEW: '1'
          VITE_C8_OWNER_PREVIEW: specials
          VITE_CONTENT8_DAILY_TASKS: '1'
        run: |
          npm run build
          npx playwright test tests/browser/wallet-progress.spec.ts tests/browser/hitapps-specials.spec.ts --output=test-results/wallet-progress
      - name: Verify the AZUR feel QA profile
        if: startsWith(github.head_ref || github.ref_name, 'feat/c8-azur-feel-')
        env:
          VITE_CONTENT8_PREVIEW: '1'
          VITE_C8_OWNER_PREVIEW: specials
          VITE_AZUR_FEEL_QA: '1'
        run: |
          npm run build
          npx playwright test tests/browser/azur-feel.spec.ts --output=test-results/azur-feel
      - name: Verify the isolated AZUR victory reward
        if: startsWith(github.head_ref || github.ref_name, 'feat/c8-azur-victory-qa-')
        env:
          VITE_CONTENT8_PREVIEW: '1'
          VITE_C8_OWNER_PREVIEW: specials
          VITE_AZUR_FEEL_QA: '1'
          VITE_AZUR_VICTORY_QA: '1'
        run: |
          npm run build
          npx playwright test tests/browser/azur-victory-reward.spec.ts --output=test-results/azur-victory
      - name: Verify the approved campaign integration preview
        if: ${{ startsWith(github.head_ref || github.ref_name, 'feat/c8-p37-hitapps-combined-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-p06-owner-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-p08-owner-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-p15-owner-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-p19-owner-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-p21-owner-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-p25-owner-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-p31-owner-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-p37-owner-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-ux-polish-') }}
        env:
          VITE_CONTENT8_PREVIEW: '1'
          VITE_C8_OWNER_PREVIEW: ${{ startsWith(github.head_ref || github.ref_name, 'feat/c8-p37-hitapps-combined-') && 'generation' || startsWith(github.head_ref || github.ref_name, 'feat/c8-p06-owner-') && 'director' || startsWith(github.head_ref || github.ref_name, 'feat/c8-p08-owner-') && 'equality' || startsWith(github.head_ref || github.ref_name, 'feat/c8-p15-owner-') && 'random-joker' || startsWith(github.head_ref || github.ref_name, 'feat/c8-p19-owner-') && 'recovery' || startsWith(github.head_ref || github.ref_name, 'feat/c8-p21-owner-') && 'ad-controls' || startsWith(github.head_ref || github.ref_name, 'feat/c8-p25-owner-') && 'storefront' || startsWith(github.head_ref || github.ref_name, 'feat/c8-p31-owner-') && 'lives' || (startsWith(github.head_ref || github.ref_name, 'feat/c8-p37-owner-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-ux-polish-')) && 'acceptance' || '' }}
        run: |
          npm run build
          npx playwright test tests/browser/owner-campaign.spec.ts --output=test-results/owner-campaign
      - name: Exercise AZUR offline offer campaign presenters and persistence
        if: startsWith(github.head_ref || github.ref_name, 'feat/c8-p25-offer-campaigns-')
        env:
          VITE_CONTENT8_PREVIEW: '1'
          VITE_C8_OWNER_PREVIEW: offer-campaigns
        run: |
          npm run build
          npx playwright test tests/browser/offer-campaigns.spec.ts --output=test-results/offer-campaigns
      - name: Exercise Hitapps one-key and pictured specials
        if: startsWith(github.head_ref || github.ref_name, 'feat/c8-hitapps-specials-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-ux-polish-') || startsWith(github.head_ref || github.ref_name, 'feat/c8-ux-feedback-')
        env:
          VITE_CONTENT8_PREVIEW: '1'
          VITE_C8_OWNER_PREVIEW: specials
        run: |
          npm run build
          npx playwright test tests/browser/hitapps-specials.spec.ts --output=test-results/hitapps-specials
      - name: Audit Hitapps balance and exercise the authoring bank on touch input
        if: startsWith(github.head_ref || github.ref_name, 'feat/c8-p37-hitapps-')
        env:
          VITE_CONTENT8_PREVIEW: '1'
          VITE_C8_OWNER_PREVIEW: director
        run: |
          npm run qa:hitapps-balance
          npm run build
          npx playwright test tests/browser/owner-campaign.spec.ts -g 'wins level 15' --output=test-results/hitapps-director
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews-evidence
          path: |
            test-results/
            .authoring/hitapps/balance.json
          retention-days: 7
  cohesion:
    runs-on: ubuntu-24.04
    env:
      VITE_ASOC_PROFILE: c8-release-v1
      ASOC_AD_MODE: disabled
      ASOC_MVP_DEMO: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/cache/restore@v4
        with:
          path: /home/runner/.npm
          key: node-cache-Linux-x64-npm-a4df24577ed48de6d871f0577006637c44d25e4ee405b275d4a7b579b77d534b
      - run: node tools/install-dependencies.mjs
        env:
          MINI_GAMES_KIT_READ_TOKEN: ${{ secrets.MINI_GAMES_KIT_READ_TOKEN }}
          ASOC_KIT_OFFLINE_CACHE: '1'
      - run: npm test -- --reporter=default --reporter=json --outputFile=.recording/mvp-unit-results.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Audit all retained and issued Deal geometries in the C8 release profile
        shell: bash
        env:
          ASOC_QA_C8_GEOMETRY: '1'
        run: npx vitest run tests/unit/c8-ui-geometry.test.ts --disableConsoleIntercept | tee .recording/c8-grid.txt
      - name: Audit C8 release geometry and capture its UI
        run: npx playwright test tests/browser/c8-ui-205.spec.ts tests/browser/c8-ftue-210.spec.ts tests/browser/c8-ads-210.spec.ts --project=compact --output=test-results/c8-ui
      - name: Verify saved rights and reward lifecycle through ordinary touch UI
        run: npx playwright test tests/browser/integrated-release.spec.ts tests/browser/mvp-cohesion-core.spec.ts tests/browser/mvp-cohesion-retention.spec.ts tests/browser/mvp-cohesion-shuffle.spec.ts --output=test-results/mvp-cohesion
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mvp-cohesion-evidence
          if-no-files-found: error
          path: |
            test-results/mvp-cohesion/
            test-results/c8-ui/
            .recording/c8-grid.txt
            .recording/mvp-unit-results.json
            dist/release-manifest.json
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    env:
      VITE_ASOC_PROFILE: c8-release-v1
      ASOC_AD_MODE: test
      ASOC_APK_VARIANT: debug
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore the accepted pinned dependency cache without writing private source back
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.npm
          key: node-cache-Linux-x64-npm-a4df24577ed48de6d871f0577006637c44d25e4ee405b275d4a7b579b77d534b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: node --test tests/infrastructure/*.test.mjs
      - run: node tools/install-dependencies.mjs
        env:
          MINI_GAMES_KIT_READ_TOKEN: ${{ secrets.MINI_GAMES_KIT_READ_TOKEN }}
          ASOC_KIT_OFFLINE_CACHE: '1'
      - run: npm run check && npm run android:sync
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/asoc-debug-signing/debug.keystore
          key: asoc-solitair-preview-signing-v2
      - name: Ensure the explicit preview signing key exists
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/asoc-debug-signing"
          if [ ! -s "$RUNNER_TEMP/asoc-debug-signing/debug.keystore" ]; then
            echo '::error::The existing preview signing identity is required; do not generate a replacement key.'
            exit 1
          fi
      - name: Build signed preview APK
        shell: bash
        run: |
          if ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee "$RUNNER_TEMP/asoc-gradle.log"; then
            exit 0
          fi
          grep -q 'https://repo.maven.apache.org/maven2' "$RUNNER_TEMP/asoc-gradle.log"
          ASOC_MAVEN_CENTRAL_MIRROR=1 ./gradlew --no-daemon --init-script ci-maven-mirror.gradle testDebugUnitTest assembleDebug
          echo 'ASOC_MAVEN_CENTRAL_MIRROR=1' >> "$GITHUB_ENV"
        working-directory: native/android
        env:
          ASOC_DEBUG_STORE_FILE: ${{ runner.temp }}/asoc-debug-signing/debug.keystore
      - name: Verify the preview APK signature
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs native/android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs native/android/app/build/outputs/apk/debug/app-debug.apk | grep -F '0335b87262e17f94803da322f0b8a0ca6ad04101246d0e701f3fc7d358a8b64e'
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging native/android/app/build/outputs/apk/debug/app-debug.apk | head -1
      - run: |
          python3 tools/qa/verify-release-apk.py native/android/app/build/outputs/apk/debug/app-debug.apk
          cp dist/release-manifest.json "$RUNNER_TEMP/release-manifest-debug.json"
      - run: npm run android:sync
        env:
          ASOC_AD_MODE: disabled
          ASOC_APK_VARIANT: release
      - run: ./gradlew --no-daemon --init-script ci-maven-mirror.gradle assembleRelease
        working-directory: native/android
        env:
          ASOC_AD_MODE: disabled
          ASOC_UNSIGNED_CHECK: '1'
      - run: python3 tools/qa/verify-release-apk.py native/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-builds
          path: |
            ${{ runner.temp }}/release-manifest-debug.json
            dist/release-manifest.json
            native/android/app/build/outputs/apk/**/*.apk
            native/android/app/build/outputs/mapping/release/
            native/android/app/build/test-results/testDebugUnitTest/
            native/android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
