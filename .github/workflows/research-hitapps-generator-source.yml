           u=setup([(0x1c85a38,0x1c85a48)]);wr(u,G+8,generated);reg(u,UC_ARM_REG_R5,G);reg(u,UC_ARM_REG_R4,total);run(u,0x1c85a38,0x1c85a48);done=rr(u,UC_ARM_REG_R0);assert done==int(generated>=total)
           amount.append([total,generated,count,delta,low,done])
          print('GOLDCOUNT29',json.dumps(amount,separators=(',',':')))
          print('PASS_NATIVE29')
