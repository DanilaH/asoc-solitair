name: Isolated reference generator inspection
on:
  push:
    branches: [research/hitapps-generator-native-20261126]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify original public build and inspect numeric source anchors
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --silent --show-error --retry 1 --max-time 100 'https://d.apkpure.net/b/XAPK/com.hitappsgames.wordsolitaire?versionCode=3742' -o "$tmp/source.xapk"
          python3 -m pip install --quiet --disable-pip-version-check 'unicorn==2.1.4' 'capstone==5.0.6'
          python3 - "$tmp/source.xapk" <<'PY'
          import hashlib,struct,sys,zipfile,io,re,bisect,json
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes()
          assert len(raw)==287832513 and hashlib.sha256(raw).hexdigest()=='22aaff3a6d5b70f217b8feb7348538f5ab3352d4e8c766406cbddcbcd71e49f0'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           with zipfile.ZipFile(io.BytesIO(z.read('com.hitappsgames.wordsolitaire.apk'))) as a: md=a.read('assets/bin/Data/Managed/Metadata/global-metadata.dat')
           with zipfile.ZipFile(io.BytesIO(z.read('config.armeabi_v7a.apk'))) as a: e=a.read('lib/armeabi-v7a/libil2cpp.so')
          assert hashlib.sha256(e).hexdigest()=='f25d9a988f6fa61eb201879f72c556a5875a4ac2c5f541670950589afbb51e26'
          assert hashlib.sha256(md).hexdigest()=='47e2db3a792411193b25ed90c590facebcb3af861834eca90cb8e433a8e14aca'
          assert struct.unpack_from('<II',md)==(0xfab11baf,31)
          print('ORIGINAL XAPK AND BOTH PRIVATE NATIVE HASHES MATCH')
          del raw
          ph=struct.unpack_from('<I',e,28)[0];step,num=struct.unpack_from('<HH',e,42)
          seg=[]
          for j in range(num):
           typ,fo,va,_,size,_,flags,_=struct.unpack_from('<8I',e,ph+j*step)
           if typ==1:seg.append((fo,va,size,flags))
          assert [va-fo for fo,va,_,_ in seg]==[0,0x4000,0x8000]
          def off(va,n=4):
           for fo,start,size,_ in seg:
            if start<=va and va+n<=start+size:return fo+va-start
           raise ValueError(hex(va))
          def va(fo):
           for start,v,size,_ in seg:
            if start<=fo<start+size:return v+fo-start
           raise ValueError(hex(fo))
          def word(a):return struct.unpack_from('<I',e,off(a))[0]
          S,SS=struct.unpack_from('<II',md,24);T,TS=struct.unpack_from('<II',md,160)
          M,MS=struct.unpack_from('<II',md,48);I,IS=struct.unpack_from('<II',md,168)
          F,FS=struct.unpack_from('<II',md,96);P,PS=struct.unpack_from('<II',md,88)
          def name(ix):
           if not 0<=ix<SS:return ''
           p=S+ix;return md[p:md.index(b'\0',p,S+SS)].decode()
          images={}
          wanted={}
          for j in range(IS//40):
           row=struct.unpack_from('<10I',md,I+40*j);im=name(row[0]);images[im]=row
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t)
            tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            if re.match(r'^(Game\.|CoreGameplay\.dll|Assembly-CSharp\.dll|GameCore\.)',im) and (re.search(r'(Lives|LifePurchaser|LifeData|LifeReserv|LifeSpend|LifeConfig|LifeRestore|NextDayWaiter|Revive|RestoreStock|ExtraMoves|MovesOffer|MovesLimit|MovesOperations|MoveOperations|MoveCount|MovesSystem|MovesLogic|MoveBudget|UnlimitedMoves|ContinueService|LevelBucketRv|GameplayState|LevelProgress|LevelResult|LevelBootstrapper|UserProgress|PlayerProgress|StockOperations|GameplayController|LevelController|MovesData|StepsData|MovesBalance)',tn,re.I) or any(re.search(r'(AddExtraMoves|AddMoves|SpendMoves|ConsumeMoves|GetMovesLeft|RemainingMoves|PendingRevive|SpendLife|ReserveLife|RestoreStock|OnLevelLost|OnLevelFailed|HandleContinue|OnContinueRequested|OnLevelWon|HandleTryAgain|LevelFinished|ResetMove|FreeRestore)',name(struct.unpack_from('<I',md,M+36*k)[0]),re.I) for k in range(tr[9],tr[9]+(tr[16]&65535)))):
             wanted.setdefault(im,[]).append((tn,tr))
          print('TARGET_IMAGES',list(wanted))
          entries={};records=[];tables={}
          for im,types in wanted.items():
           row=images[im];pos=e.find(im.encode()+b'\0')
           if pos<0:print('NO_MODULE_STRING',im);continue
           marker=struct.pack('<I',va(pos));found=[]
           for fo,v,size,_ in seg[1:]:
            data=e[fo:fo+size];j=-1
            while (j:=data.find(marker,j+1))>=0:
             if j+12>size:continue
             n,p=struct.unpack_from('<II',data,j+4)
             if not 0<n<25000:continue
             try: ptrs=struct.unpack_from('<%dI'%n,e,off(p,n*4))
             except (ValueError,struct.error):continue
             if all(a==0 or 0x148b0b0<=a<0x6a167d0 for a in ptrs):found.append((v+j,n,p,ptrs))
           if len(found)!=1:print('AMBIGUOUS_MODULE',im,len(found));continue
           descriptor,n,table,ptrs=found[0];tables[im]=[hex(descriptor),n,hex(table)]
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t);tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            for i in range(tr[9],tr[9]+(tr[16]&65535)):
             mr=struct.unpack_from('<7I4H',md,M+36*i);rid=mr[6]&0xffffff
             if not 0<rid<=n:continue
             a=ptrs[rid-1];mn=name(mr[0])
             rec={'image':im,'type':tn,'method':mn,'rid':rid,'rva':hex(a),'parameters':[name(struct.unpack_from('<I',md,P+12*(mr[4]+k))[0]) for k in range(mr[-1])]}
             if a:entries.setdefault(a,[]).append(rec)
             if any(tn==x[0] for x in types):records.append(rec)
          print('MODULES',json.dumps(tables))
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM
          d=Cs(CS_ARCH_ARM,CS_MODE_ARM)
          starts=sorted(entries)
          def instructions(a,b):
           return list(d.disasm(e[off(a,b-a):off(a,b-a)+b-a],a))
          def names_at(a):
           return [x['type']+'.'+x['method'] for x in entries.get(a,[])][:2]
          def compact(x):
           # Numeric dataflow anchor; no original instruction bytes or decompiled source.
           op=x.mnemonic
           if op.startswith(('bl','b','cmp','cmn','tst','teq','ldr','str','mov','add','sub','and','orr','bic','eor','rsb','ux','lsl','asr','lsr','mvn','pop','push','stm','ldm','mul')):
            return [hex(x.address),op,x.op_str]
           return None
          # Reconcile actual field rows and registered method entries. No source strings beyond symbolic names.
          selected_type=re.compile(r'(\.LimitedLives\.Implementations\.(LimitedLivesModule|LifePurchaser|LimitLifeRestoreTimerController|NextDayWaiter)$|\.InfiniteLives\.Implementations\.(InfiniteLivesModule|DeferredInfiniteLivesAward|InfiniteLivesAwardService)$|\.Lives\.Implementations\.LivesService$|\.LivesSpendProvider$|\.LivesStorageHandler$|\.PaidRestoreStockService$|\.ReviveMovesOffer\.Internal\.(ReviveMovesCalculator|ReviveMovesOfferService|ReviveOfferTypeCalculator|ReviveMovesOfferProcessor|ReviveOfferContentSearcher)$|\.ExtraMovesBubble(Service|Policy|SaveData|PurchaseProcessor)$|\.MovesOfferData$|\.LivesData$|\.LivesConfig$|\.RevivesMovesOfferConfig$|\.PaidRestoreConfig$|\.LevelBootstrapper$|Core\.Systems\.(MoveCounterSystem|MoveOperations|StockOperations|GameplayStateOperations|GameplayStateSystem|GameplayStateLogicSystem|MovesOperations)$|\.LevelProgressData$|\.LevelProgress$|\.UserProgress$)',re.I)
          method_pat=re.compile(r'(AddExtraMoves|AddMoves|SpendMoves|ConsumeMoves|GetMovesLeft|RemainingMoves|PendingRevive|SpendLife|ReserveLife|RestoreStock|OnLevelLost|OnLevelFailed|HandleContinue|OnContinueRequested|OnLevelWon|HandleTryAgain|LevelFinished|ResetMove|FreeRestore|MovesLeft|MovesLimit|GetSteps|SetSteps|ContinueGame)',re.I)
          ignore=re.compile(r'Formatter|Migrator|\.Migration\.|\.Cheat|\.Sample\.|\.Analytics\.|\.AJson|ViewModel|\.Mock|\.Tests|\._1_13_0\.|IUserData|^<|__AJson|global::',re.I)
          for im,types in wanted.items():
           for tn,tr in types:
            ms=[r for r in records if r['image']==im and r['type']==tn and r['rva']!='0x0']
            if ignore.search(tn):continue
            fields=[name(struct.unpack_from('<I',md,F+fi*12)[0]) for fi in range(tr[8],tr[8]+(tr[17]&65535)) if 0<=fi<FS//12]
            if selected_type.search(tn) or any(method_pat.search(r['method']) for r in ms) or any(re.search(r'(extra|pending|move|life|restor|limit|continue)',f,re.I) for f in fields) and re.search(r'(Current|Core\.Entities|Progress|Reserve|Budget|Pool|State)',tn):
             print('TYPE31',json.dumps({'image':im,'type':tn,'fields':fields,'methods':[[r['method'],r['rva'],r['parameters']] for r in ms if not ignore.search(r['method'])]},separators=(',',':')))
          # Bound analysis: primary lifecycle bodies and arithmetic, avoid boilerplate serialization/UI/analytics.
          focus=re.compile(r'^(Calculate|CalculateRestoredAmountOfLives|GetTimeToNextLifeRestore|SynchronizeLives|TryReduceLife|TryAddLife|TrySpendLife|TryPurchaseLife|RestoreLife|ResetLimits|ResetLimitsOnNewDay|NeedResetLimits|RecalculateNearestStartRestoreTime|SetNewStartRestoreTime|ClearSavedStartRestoreTime|GetPurchaseByCurrencyPrice|GetUtcTimeAtFullLivesRestored|AddInfiniteLivesFor|FinishInfiniteLives|SyncState|RestoreInfiniteLivesTimer|MarkLifeCanBeSpent|RemoveMarkLifeCanBeSpent|OnEvent|OnLevelValueChanged|Get|OnAdd|OnTrySpend|OnSetInfinite|HasInfiniteLives|TryPurchaseRestore|RefundRestore|CanAffordRestore|Reset|get_CurrentRestoreCost|get_IsFreeRestoreAvailable|get_IsLastFinishedRestoreFree|CalculateMovesToOffer|CanShow|TryGetPendingReviveMoves|TryResetPendingReviveMoves|OnOfferShown|OnOfferPurchased|ApplyMovesReward|CompletePurchase|CompleteCoinsOfferPurchase|EnsureSessionInitialized|IsRvDeniedByPolicy|CanTakeLifeByAds|IsAdsLimitNotReached|CanPurchaseLifeByCurrency|PayerForcesAlternativePayment|TryConsumePendingMoves|TryResetPendingMoves|ConfirmPurchase|GrantNow|RecordIntent|ClearIntent|ResetIntent|ApplyPendingBubbleMoves|ResolveMovesAmount|GetMovesAmount|SetRemainingCards|IsAwaitingStoreTooLong|IsBeyondReportingWindow|Increment|Update|HandleAddExtraMoves|HandleContinue|HandleTryAgain|OnLevelWon|OnLevelLost|OnLevelFailed|OnContinueRequested|GetStepsLimit|TryRestoreStock|RestoreStock)$')
          seen=set()
          for r in records:
           tn=r['type'];mn=r['method'];a=int(r['rva'],16)
           if not a or ignore.search(tn) or (tn,mn,a) in seen:continue
           if not ((selected_type.search(tn) and focus.search(mn)) or method_pat.search(mn) and not re.search(r'(View|Presenter|Popup|Analytics|Track|Tutorial|\.Abstractions\.|\.Config)',tn) and not re.search(r'^get_|^set_|^add_|^remove_',mn)):continue
           i=bisect.bisect_right(starts,a)
           if i>=len(starts):continue
           b=starts[i]
           if b-a>0x1200 or b-a<4:continue
           seen.add((tn,mn,a));ins=instructions(a,b)
           calls=[[hex(x.address),hex(int(x.op_str[1:],16)),names_at(int(x.op_str[1:],16))] for x in ins if x.mnemonic.startswith('bl') and x.op_str.startswith('#0x')]
           # Numeric instruction anchors; strip metadata initialization and alignment noise from review.
           facts=[f for x in ins if (f:=compact(x)) is not None and not (x.mnemonic=='streq' and x.address>=b-32)]
           print('METHOD31',json.dumps({'type':tn,'method':mn,'params':r['parameters'],'a':hex(a),'b':hex(b),'calls':calls,'facts':facts},separators=(',',':')))
          print('PASS_SHA_PINNED_RECOVERY_DEEP31')
          PY
