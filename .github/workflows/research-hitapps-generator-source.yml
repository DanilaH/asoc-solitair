name: Isolated reference generator inspection
on:
  push:
    branches: [research/hitapps-generator-native-20261126]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify original public build and inspect numeric source anchors
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --silent --show-error --retry 1 --max-time 100 'https://d.apkpure.net/b/XAPK/com.hitappsgames.wordsolitaire?versionCode=3742' -o "$tmp/source.xapk"
          python3 -m pip install --quiet --disable-pip-version-check 'unicorn==2.1.4' 'capstone==5.0.6'
          python3 - "$tmp/source.xapk" <<'PY'
          import hashlib,struct,sys,zipfile,io,re,bisect,json
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes()
          assert len(raw)==287832513 and hashlib.sha256(raw).hexdigest()=='22aaff3a6d5b70f217b8feb7348538f5ab3352d4e8c766406cbddcbcd71e49f0'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           with zipfile.ZipFile(io.BytesIO(z.read('com.hitappsgames.wordsolitaire.apk'))) as a: md=a.read('assets/bin/Data/Managed/Metadata/global-metadata.dat')
           with zipfile.ZipFile(io.BytesIO(z.read('config.armeabi_v7a.apk'))) as a: e=a.read('lib/armeabi-v7a/libil2cpp.so')
          assert hashlib.sha256(e).hexdigest()=='f25d9a988f6fa61eb201879f72c556a5875a4ac2c5f541670950589afbb51e26'
          assert hashlib.sha256(md).hexdigest()=='47e2db3a792411193b25ed90c590facebcb3af861834eca90cb8e433a8e14aca'
          assert struct.unpack_from('<II',md)==(0xfab11baf,31)
          print('ORIGINAL XAPK AND BOTH PRIVATE NATIVE HASHES MATCH')
          del raw
          ph=struct.unpack_from('<I',e,28)[0];step,num=struct.unpack_from('<HH',e,42)
          seg=[]
          for j in range(num):
           typ,fo,va,_,size,_,flags,_=struct.unpack_from('<8I',e,ph+j*step)
           if typ==1:seg.append((fo,va,size,flags))
          assert [va-fo for fo,va,_,_ in seg]==[0,0x4000,0x8000]
          def off(va,n=4):
           for fo,start,size,_ in seg:
            if start<=va and va+n<=start+size:return fo+va-start
           raise ValueError(hex(va))
          def va(fo):
           for start,v,size,_ in seg:
            if start<=fo<start+size:return v+fo-start
           raise ValueError(hex(fo))
          def word(a):return struct.unpack_from('<I',e,off(a))[0]
          S,SS=struct.unpack_from('<II',md,24);T,TS=struct.unpack_from('<II',md,160)
          M,MS=struct.unpack_from('<II',md,48);I,IS=struct.unpack_from('<II',md,168)
          F,FS=struct.unpack_from('<II',md,96);P,PS=struct.unpack_from('<II',md,88)
          def name(ix):
           if not 0<=ix<SS:return ''
           p=S+ix;return md[p:md.index(b'\0',p,S+SS)].decode()
          images={}
          wanted={}
          for j in range(IS//40):
           row=struct.unpack_from('<10I',md,I+40*j);im=name(row[0]);images[im]=row
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t)
            tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            if re.match(r'^(Game\.|CoreGameplay\.dll|Assembly-CSharp\.dll|GameCore\.)',im) and (re.search(r'(Streak|Combo|LevelSaveProgress|LevelProgressData|LevelLifecycleService|CardFactData|MoveFactData|MoveOperations|MoveCounterSystem|MoveRequest|GameplayContextFactory|CoreGameplayController|RewardProcessor|RewardType)',tn,re.I) or any(re.search(r'(Streak|Combo)',name(struct.unpack_from('<I',md,M+36*k)[0]),re.I) for k in range(tr[9],tr[9]+(tr[16]&65535)))):
             wanted.setdefault(im,[]).append((tn,tr))
          print('TARGET_IMAGES',list(wanted))
          entries={};records=[];tables={}
          for im,types in wanted.items():
           row=images[im];pos=e.find(im.encode()+b'\0')
           if pos<0:print('NO_MODULE_STRING',im);continue
           marker=struct.pack('<I',va(pos));found=[]
           for fo,v,size,_ in seg[1:]:
            data=e[fo:fo+size];j=-1
            while (j:=data.find(marker,j+1))>=0:
             if j+12>size:continue
             n,p=struct.unpack_from('<II',data,j+4)
             if not 0<n<25000:continue
             try: ptrs=struct.unpack_from('<%dI'%n,e,off(p,n*4))
             except (ValueError,struct.error):continue
             if all(a==0 or 0x148b0b0<=a<0x6a167d0 for a in ptrs):found.append((v+j,n,p,ptrs))
           if len(found)!=1:print('AMBIGUOUS_MODULE',im,len(found));continue
           descriptor,n,table,ptrs=found[0];tables[im]=[hex(descriptor),n,hex(table)]
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t);tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            for i in range(tr[9],tr[9]+(tr[16]&65535)):
             mr=struct.unpack_from('<7I4H',md,M+36*i);rid=mr[6]&0xffffff
             if not 0<rid<=n:continue
             a=ptrs[rid-1];mn=name(mr[0])
             rec={'image':im,'type':tn,'method':mn,'rid':rid,'rva':hex(a),'parameters':[name(struct.unpack_from('<I',md,P+12*(mr[4]+k))[0]) for k in range(mr[-1])]}
             if a:entries.setdefault(a,[]).append(rec)
             if any(tn==x[0] for x in types):records.append(rec)
          print('MODULES',json.dumps(tables))
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM
          d=Cs(CS_ARCH_ARM,CS_MODE_ARM)
          starts=sorted(entries)
          def instructions(a,b):
           return list(d.disasm(e[off(a,b-a):off(a,b-a)+b-a],a))
          def names_at(a):
           return [x['type']+'.'+x['method'] for x in entries.get(a,[])][:2]
          def compact(x):
           # Numeric dataflow anchor; no original instruction bytes or decompiled source.
           op=x.mnemonic
           if op.startswith(('bl','b','cmp','cmn','tst','teq','ldr','str','mov','add','sub','and','orr','bic','eor','rsb','ux','lsl','asr','lsr','mvn','pop','push','stm','ldm','mul')):
            return [hex(x.address),op,x.op_str]
           return None
          from unicorn import Uc,UC_ARCH_ARM,UC_MODE_ARM,UC_HOOK_CODE
          from unicorn.arm_const import *
          import itertools,math
          B=0x11000000; STOP=B+0xf0000; OBJ=B+0x1000; DATA=B+0x2000; CFG=B+0x3000
          def setup(ranges):
           u=Uc(UC_ARCH_ARM,UC_MODE_ARM);u.mem_map(B,0x100000);u.reg_write(UC_ARM_REG_SP,B+0xe0000);u.reg_write(UC_ARM_REG_LR,STOP);u.reg_write(UC_ARM_REG_FPEXC,0x40000000)
           pages=set()
           for a,b in ranges:
            for p in range(a&~4095,((b+4095)//4096)*4096,4096):
             if p not in pages:u.mem_map(p,4096);u.mem_write(p,e[off(p,4096):off(p,4096)+4096]);pages.add(p)
           return u
          def wr(u,p,v):u.mem_write(p,struct.pack('<I',v&0xffffffff))
          def wh(u,p,v):u.mem_write(p,struct.pack('<H',v&65535))
          def wb(u,p,v):u.mem_write(p,bytes([v&255]))
          def wq(u,p,v):u.mem_write(p,struct.pack('<Q',v&0xffffffffffffffff))
          def rd(u,p):return struct.unpack('<I',u.mem_read(p,4))[0]
          def rh(u,p):return struct.unpack('<H',u.mem_read(p,2))[0]
          def rb(u,p):return u.mem_read(p,1)[0]
          def rq(u,p):return struct.unpack('<Q',u.mem_read(p,8))[0]
          def rr(u,r):return u.reg_read(r)
          def reg(u,r,v):u.reg_write(r,v&0xffffffff)
          def args(u,*vs):
           for r,v in zip((UC_ARM_REG_R0,UC_ARM_REG_R1,UC_ARM_REG_R2,UC_ARM_REG_R3),vs):reg(u,r,v)
          def run(u,a,end,skips=None,calls=None,stops=(),count=400):
           skips=skips or {};calls=calls or {};trace=[]
           def hook(uc,pc,size,user):
            if pc in stops:trace.append(pc);uc.emu_stop();return
            if pc in skips:
             item=skips[pc]
             if callable(item):item(uc)
             else:reg(uc,UC_ARM_REG_PC,item)
            elif pc in calls:
             item=calls[pc];trace.append(pc)
             if callable(item):item(uc)
             else:reg(uc,UC_ARM_REG_R0,item)
             reg(uc,UC_ARM_REG_PC,rr(uc,UC_ARM_REG_LR))
           u.hook_add(UC_HOOK_CODE,hook);u.emu_start(a,end,count=count)
           assert rr(u,UC_ARM_REG_PC)==end or rr(u,UC_ARM_REG_PC) in stops,(hex(a),hex(rr(u,UC_ARM_REG_PC)),trace)
           return trace
          rows={}
          def out(k,v):rows[k]=v;print(k,json.dumps(v,separators=(',',':')))
          # Direct callers across exact ELF, plus actual named field ownership and dispatch jump table.
          targets={a:[] for a in (0x1c87b14,0x1c87a90,0x1c86988,0x1c87434,0x1d76a24,0x1e6fdc0,0x1e70644,0x1e70780,0x1e70db0,0x1e70e40,0x1e70ed0,0x20b3244,0x20b2ad8,0x20aff90,0x20b29c4,0x20b1bb0)}
          for fo,v,size,flags in seg:
           if not flags&1:continue
           for i,(w,) in enumerate(struct.iter_unpack('<I',e[fo:fo+size//4*4])):
            if w&0x0e000000!=0x0a000000 or w>>28==15:continue
            pc=v+4*i;delta=w&0xffffff;delta=(delta if delta<0x800000 else delta-0x1000000)<<2
            a=pc+8+delta
            if a not in targets:continue
            idx=bisect.bisect_right(starts,pc)-1;targets[a].append([hex(pc),hex(starts[idx]) if idx>=0 else None,names_at(starts[idx]) if idx>=0 else []])
          for a,hits in targets.items():print('CALL36',json.dumps({'target':hex(a),'hits':hits},separators=(',',':')))
          for im,row in images.items():
           if not re.match(r'^(Game\.|CoreGameplay|Assembly-CSharp)',im):continue
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t);tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            if re.search(r'Formatter|Migration|Cheat|\.Sample|_1_13_0',tn):continue
            fs=[name(struct.unpack_from('<I',md,F+fi*12)[0]) for fi in range(tr[8],tr[8]+(tr[17]&65535)) if 0<=fi<FS//12]
            if (any(re.search(r'(streak|combo)',f,re.I) for f in fs) and not re.search(r'View|Presenter|Widget|Analytics|UserData|Config|__',tn)) or re.search(r'(^Core\.Entities\..*(State|Undo)|^Core\.Systems\..*(Observable|Undo))',tn):
             ms=[r for r in records if r['type']==tn and r['image']==im and r['rva']!='0x0']
             print('OWNER36',json.dumps({'image':im,'type':tn,'fields':[f for f in fs if not f.startswith('__')],'methods':[[r['method'],r['rva'],r['parameters']] for r in ms if not re.search(r'get_|set_|__AJson|global::',r['method'])]},separators=(',',':')))
          print('DISPATCH36',json.dumps([[i,hex(0x1ce8244+word(0x1ce8244+4*i))] for i in range(10)]))
          # Targeted native slices: actual clone dispatch functions, stock/undo, reward consumers, event stage gate.
          for label,a,b in [('placed-clone',0x1cf5c24,0x1cf6060),('rejected-clone',0x1cf6060,0x1cf62ec),('stock-clone',0x1cf62ec,0x1cf6500),('undo-clone',0x1cf6500,0x1cf6780),('undo-branch',0x1c875a0,0x1c87640),('win-stage-complete',0x20b9ca4,0x20b9cb8),('win-claim-gate',0x20b02c8,0x20b030c),('win-loss-gate',0x20b29c4,0x20b2a10),('win-stage-loss',0x20b3310,0x20b3350),('source-gate',0x1c86858,0x1c8687c),('stock-gate',0x1c87288,0x1c87294)]:
           print('ANCHOR36',json.dumps({'name':label,'a':hex(a),'b':hex(b),'facts':[[hex(x.address),x.mnemonic,x.op_str,names_at(int(x.op_str[1:],16)) if x.mnemonic.startswith('b') and re.fullmatch(r'#0x[0-9a-f]+',x.op_str) else []] for x in instructions(a,b)]},separators=(',',':')))
          # Tier clone called by original action dispatch — same native branch with original getter/setter boundaries.
          clone=[]
          for count in (1,2,4,7):
           for stage,threshold,progress in itertools.product(range(count),(1,4,7),range(10)):
            u=setup([(0x1c91d08,0x1c91ddc),(0x1e7a328,0x1e7a32c),(0x1e7a390,0x1e7a394),(0x1e7a450,0x1e7a454)])
            wr(u,CFG+0x14,OBJ);wr(u,OBJ+0xc,count);wr(u,DATA+8,threshold)
            marker=B+0x6000;wb(u,marker,0)
            reg(u,UC_ARM_REG_R6,DATA);reg(u,UC_ARM_REG_R4,progress);reg(u,UC_ARM_REG_R5,B+0x7000);reg(u,UC_ARM_REG_R7,CFG);reg(u,UC_ARM_REG_R10,marker)
            state=[stage,progress]
            run(u,0x1c91d08,0x1c91ddc,skips={0x1c91d14:0x1c91d28,0x1c91d88:0x1c91d8c,0x1c91d90:0x1c91da0,0x1c91db8:0x1c91dcc},calls={0x1e7a328:lambda uc:reg(uc,UC_ARM_REG_R0,state[0]),0x1e7a390:lambda uc:state.__setitem__(0,rr(uc,UC_ARM_REG_R1)),0x1e7a450:lambda uc:state.__setitem__(1,rr(uc,UC_ARM_REG_R1))})
            ex=[stage,progress,0] if progress<threshold else [min(stage+1,count-1),0,2 if stage+1>=count else 1]
            got=state+[rb(u,marker)];assert got==ex,(count,stage,threshold,progress,got,ex);clone.append([count,stage,threshold,progress,*got])
          out('CLONE36',clone)
          # Native Undo result-type branch after restored saved progress/stage and resolved current stage record.
          undo=[]
          for threshold,restored in itertools.product((0,1,4,5,7),range(10)):
           u=setup([(0x1c875e4,0x1c87628),(0x1e7a3e8,0x1e7a3ec)])
           wr(u,DATA+8,threshold);reg(u,UC_ARM_REG_R5,DATA)
           run(u,0x1c875e4,0x1c87628,skips={0x1c875f0:0x1c87604},calls={0x1e7a3e8:restored})
           got=rr(u,UC_ARM_REG_R5);assert got==(3 if threshold>=1 and restored==threshold-1 else 0);undo.append([threshold,restored,got])
          out('UNDO36',undo)
          # Source stock reset: config gate then update-to-zero; event emitted only if old fill positive.
          stock=[]
          for enabled,old in itertools.product((0,1),range(9)):
           u=setup([(0x1c87288,0x1c8740c),(0x1e7a3e8,0x1e7a3ec),(0x1e7a450,0x1e7a454),(0x1c91c0c,0x1c91c10)])
           wb(u,CFG+0x11,enabled);reg(u,UC_ARM_REG_R6,CFG)
           state=[old];updated=[]
           def afterMetadata(uc):reg(uc,UC_ARM_REG_R5,B+0x7000);reg(uc,UC_ARM_REG_PC,0x1c8736c)
           run(u,0x1c87288,0x1c8740c,skips={0x1c87294:afterMetadata},calls={0x1e7a3e8:lambda uc:reg(uc,UC_ARM_REG_R0,state[0]),0x1e7a450:lambda uc:state.__setitem__(0,rr(uc,UC_ARM_REG_R1)),0x1c91c0c:lambda uc:updated.append(1)},stops=(0x1c873b0,))
           got=state+[len(updated),int(rr(u,UC_ARM_REG_PC)==0x1c873b0)];ex=[0 if enabled else old,enabled,int(enabled and old>=1)]
           assert got==ex,(enabled,old,got,ex);stock.append([enabled,old,*got])
          out('STOCK36',stock)
          # Native win-streak leave/claim and loss warning gates with synthetic service state.
          leave=[]
          for last,expired,unclaimed in itertools.product((0,1),repeat=3):
           u=setup([(0x20b02c8,0x20b030c),(0x20b382c,0x20b3830),(0x20b0454,0x20b0458),(0x20af820,0x20af824)])
           args(u,OBJ);run(u,0x20b02c8,STOP,calls={0x20b382c:last,0x20b0454:expired,0x20af820:unclaimed})
           got=rr(u,UC_ARM_REG_R0);assert got==int(last or expired and not unclaimed);leave.append([last,expired,unclaimed,got])
          out('LEAVE36',leave)
          loss=[]
          for progress,joined in itertools.product((0,1,2,9),(0,1)):
           u=setup([(0x20b29c4,0x20b2a10),(0x20b1184,0x20b1188),(0x20b268c,0x20b2690)])
           wr(u,OBJ+0x14,DATA);wr(u,DATA+0xc,progress);args(u,CFG)
           # Tailcall IsPlayerInWinStreakEvent uses original LR restored; hook returns controlled joined.
           run(u,0x20b29c4,STOP,calls={0x20b1184:OBJ,0x20b268c:joined})
           got=rr(u,UC_ARM_REG_R0);assert got==int(progress>=1 and joined);loss.append([progress,joined,got])
          out('LOSSWARN36',loss)
          print('PASS_SHA_PINNED_STREAK_KERNELS36',json.dumps({k:len(v) for k,v in rows.items()}))
          PY
