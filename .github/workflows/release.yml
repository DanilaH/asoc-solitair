name: Signed Android release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --no-audit --no-fund
      - run: npm run check && npm run android:sync
      - name: Build using configured signing identity
        env:
          ASOC_AD_MODE: live
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.YANDEX_INTERSTITIAL_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY }}
          STORE_BASE64: ${{ secrets.ASOC_STORE_BASE64 }}
          ASOC_STORE_PASSWORD: ${{ secrets.ASOC_STORE_PASSWORD }}
          ASOC_KEY_ALIAS: ${{ secrets.ASOC_KEY_ALIAS }}
          ASOC_KEY_PASSWORD: ${{ secrets.ASOC_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$STORE_BASE64" && test -n "$ASOC_STORE_PASSWORD" && test -n "$ASOC_KEY_ALIAS" && test -n "$ASOC_KEY_PASSWORD"
          export ASOC_STORE_FILE="$RUNNER_TEMP/asoc-release.jks"
          trap 'rm -f "$ASOC_STORE_FILE"' EXIT
          printf '%s' "$STORE_BASE64" | base64 --decode > "$ASOC_STORE_FILE"
          cd native/android
          ./gradlew --no-daemon assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: asoc-solitair-signed
          path: |
            native/android/app/build/outputs/apk/release/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
          retention-days: 7
