            selected=slots[idx][2]
            assert [x[1] for x in out]==[int(i==idx) for i in range(len(slots))]
            assert [rd(u,COLS+28+16*c) for c in range(len(lens))]==[int(c==selected) for c in range(len(lens))]
            print('MARK_SAMPLE23',json.dumps({'lens':lens,'index':idx,'distances':[x[4] for x in out],'expected':[min(4,abs(idx-i)) if slots[i][2]==selected else 4 for i in range(len(slots))]}))
            marks.append([lens,idx,[x[4] for x in out]])
          print('MARK22',json.dumps(marks,separators=(',',':')))
          print('PASS_SHA_PINNED_GOLD_SCORING23_OBSERVED_MARK')
          PY
