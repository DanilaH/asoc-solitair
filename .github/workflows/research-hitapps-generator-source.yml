name: Isolated Hitapps meta reward research
on:
  pull_request:
    branches: [research/hitapps-generator-native-20261126]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify original public build and inspect numeric source anchors
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --silent --show-error --retry 1 --max-time 100 'https://d.apkpure.net/b/XAPK/com.hitappsgames.wordsolitaire?versionCode=3742' -o "$tmp/source.xapk"
          python3 -m pip install --quiet --disable-pip-version-check 'unicorn==2.1.4' 'capstone==5.0.6'
          python3 - "$tmp/source.xapk" <<'PY'
          import hashlib,struct,sys,zipfile,io,re,bisect,json
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes()
          assert len(raw)==287832513 and hashlib.sha256(raw).hexdigest()=='22aaff3a6d5b70f217b8feb7348538f5ab3352d4e8c766406cbddcbcd71e49f0'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           with zipfile.ZipFile(io.BytesIO(z.read('com.hitappsgames.wordsolitaire.apk'))) as a: md=a.read('assets/bin/Data/Managed/Metadata/global-metadata.dat')
           with zipfile.ZipFile(io.BytesIO(z.read('config.armeabi_v7a.apk'))) as a: e=a.read('lib/armeabi-v7a/libil2cpp.so')
          assert hashlib.sha256(e).hexdigest()=='f25d9a988f6fa61eb201879f72c556a5875a4ac2c5f541670950589afbb51e26'
          assert hashlib.sha256(md).hexdigest()=='47e2db3a792411193b25ed90c590facebcb3af861834eca90cb8e433a8e14aca'
          assert struct.unpack_from('<II',md)==(0xfab11baf,31)
          print('ORIGINAL XAPK AND BOTH PRIVATE NATIVE HASHES MATCH')
          del raw
          ph=struct.unpack_from('<I',e,28)[0];step,num=struct.unpack_from('<HH',e,42)
          seg=[]
          for j in range(num):
           typ,fo,va,_,size,_,flags,_=struct.unpack_from('<8I',e,ph+j*step)
           if typ==1:seg.append((fo,va,size,flags))
          assert [va-fo for fo,va,_,_ in seg]==[0,0x4000,0x8000]
          def off(va,n=4):
           for fo,start,size,_ in seg:
            if start<=va and va+n<=start+size:return fo+va-start
           raise ValueError(hex(va))
          def va(fo):
           for start,v,size,_ in seg:
            if start<=fo<start+size:return v+fo-start
           raise ValueError(hex(fo))
          def word(a):return struct.unpack_from('<I',e,off(a))[0]
          S,SS=struct.unpack_from('<II',md,24);T,TS=struct.unpack_from('<II',md,160)
          M,MS=struct.unpack_from('<II',md,48);I,IS=struct.unpack_from('<II',md,168)
          F,FS=struct.unpack_from('<II',md,96);P,PS=struct.unpack_from('<II',md,88)
          def name(ix):
           if not 0<=ix<SS:return ''
           p=S+ix;return md[p:md.index(b'\0',p,S+SS)].decode()
          images={}
          wanted={}
          for j in range(IS//40):
           row=struct.unpack_from('<10I',md,I+40*j);im=name(row[0]);images[im]=row
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t)
            tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            if re.match(r'^(Game\.|CoreGameplay\.dll|Assembly-CSharp\.dll|GameCore\.)',im) and (re.search(r'(Digging|DigEvent|DigField|DigBoard|LuckyWheel|EndlessTreasure|MetaRegion|MetaBuilding|MetaUnlock|MetaStar|StarCurrency|MetaData|MetaConfig|MetaProgress|MetaReward|MetaXp|MetaCurrency|MetaObject|\.Meta\.)',tn,re.I) or any(re.search(r'(Digging|DigEvent|DigField|DigBoard|LuckyWheel|EndlessTreasure|MetaRegion|MetaBuilding|MetaUnlock|MetaStar|StarCurrency|MetaData|MetaConfig|MetaProgress|MetaReward|MetaXp|MetaCurrency|MetaObject|\.Meta\.)',name(struct.unpack_from('<I',md,M+36*k)[0]),re.I) for k in range(tr[9],tr[9]+(tr[16]&65535)))):
             wanted.setdefault(im,[]).append((tn,tr))
          print('TARGET_IMAGES',list(wanted))
          entries={};records=[];tables={}
          for im,types in wanted.items():
           row=images[im];pos=e.find(im.encode()+b'\0')
           if pos<0:print('NO_MODULE_STRING',im);continue
           marker=struct.pack('<I',va(pos));found=[]
           for fo,v,size,_ in seg[1:]:
            data=e[fo:fo+size];j=-1
            while (j:=data.find(marker,j+1))>=0:
             if j+12>size:continue
             n,p=struct.unpack_from('<II',data,j+4)
             if not 0<n<25000:continue
             try: ptrs=struct.unpack_from('<%dI'%n,e,off(p,n*4))
             except (ValueError,struct.error):continue
             if all(a==0 or 0x148b0b0<=a<0x6a167d0 for a in ptrs):found.append((v+j,n,p,ptrs))
           if len(found)!=1:print('AMBIGUOUS_MODULE',im,len(found));continue
           descriptor,n,table,ptrs=found[0];tables[im]=[hex(descriptor),n,hex(table)]
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t);tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            for i in range(tr[9],tr[9]+(tr[16]&65535)):
             mr=struct.unpack_from('<7I4H',md,M+36*i);rid=mr[6]&0xffffff
             if not 0<rid<=n:continue
             a=ptrs[rid-1];mn=name(mr[0])
             rec={'image':im,'type':tn,'method':mn,'rid':rid,'rva':hex(a),'parameters':[name(struct.unpack_from('<I',md,P+12*(mr[4]+k))[0]) for k in range(mr[-1])]}
             if a:entries.setdefault(a,[]).append(rec)
             if any(tn==x[0] for x in types):records.append(rec)
          print('MODULES',json.dumps(tables))
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM
          d=Cs(CS_ARCH_ARM,CS_MODE_ARM)
          starts=sorted(entries)
          def instructions(a,b):
           return list(d.disasm(e[off(a,b-a):off(a,b-a)+b-a],a))
          def names_at(a):
           return [x['type']+'.'+x['method'] for x in entries.get(a,[])][:2]
          def compact(x):
           # Numeric dataflow anchor; no original instruction bytes or decompiled source.
           op=x.mnemonic
           if op.startswith(('bl','b','cmp','cmn','tst','teq','ldr','str','mov','add','sub','and','orr','bic','eor','rsb','ux','lsl','asr','lsr','mvn','pop','push','stm','ldm','mul')):
            return [hex(x.address),op,x.op_str]
           return None
          ignore=re.compile(r'Formatter|Migrator|\.Migration\.|\.Cheat|\.Sample\.|\.Analytics\.|\.AJson|\.Mock|\.Tests|\._1_13_0\.|__AJson|global::',re.I)
          focus=re.compile(r'(Digging|DigEvent|DigField|DigBoard|LuckyWheel|EndlessTreasure|MetaRegion|MetaBuilding|MetaUnlock|MetaStar|StarCurrency|MetaData|MetaConfig|MetaProgress|MetaReward|MetaXp|MetaCurrency|MetaObject|\.Meta\.)',re.I)
          for im,types in wanted.items():
           for tn,tr in types:
            if ignore.search(tn):continue
            ms=[r for r in records if r['image']==im and r['type']==tn]
            fields=[name(struct.unpack_from('<I',md,F+fi*12)[0]) for fi in range(tr[8],tr[8]+(tr[17]&65535)) if 0<=fi<FS//12]
            if focus.search(tn) or any(focus.search(r['method']) for r in ms):
             print('META_TYPE',json.dumps({'image':im,'type':tn,'fields':[f for f in fields if not f.startswith('__')],'methods':[[r['method'],r['rva'],r['parameters']] for r in ms if not ignore.search(r['method']) and not re.match('add_|remove_',r['method'])]},separators=(',',':')))
          target={
           "WheelSpinResolver": ["Resolve","IsEligible"],
           "WheelLevelController": ["ProcessSpin","AdvanceLevel","HasActiveSegments","InitLevel"],
           "LuckyWheelRunController": ["ProcessSpin","BurnLeftoverSpinTokens"],
           "LuckyWheelQuestPool": ["TryDrawNextTask","TryDrawFromRemaining","PickDifficultyWithRemaining","ResetDrawState","OnProgressRegistered","ClaimReward"],
           "LuckyWheelProbabilityRows":["DistributePercents","Build"],
           "DiggingStageState":["Index","get_CellCount"],
           "DiggingStageBuilder":["ComputeShuffleSeed","GenerateNonZeroSeed","InBounds","RandomStartWithMargin","PlaceHiddenObject","TryCollectIndices","PlaceElements","PlaceJsonElements","ApplyHitCounts","InitializeNormalCells"],
           "DiggingStageController":["TryTapCell","AreAllCellsOpened","AreAllObjectsFound","TryMarkHiddenObjectFound"],
           "DiggingMoleResolver":["WalkMoleLine","ProcessMoleLine","ResolveChain"],
           "DiggingTokenProcessor":["TrySpend","EnsureAtLeast","AddTokens"],
           "DiggingStageAwardController":["ClaimStageReward","ValidatePendingReward","ApplyStageAward"],
           "EndlessTreasureActiveEventResolver":["NextIndex","ResolveByIndex"],
           "EndlessTreasureClaimCoordinator":["ApplyStepProgress","GetPendingMilestoneRewardIndex","TryClaimCurrentMilestoneReward"],
           "EndlessTreasureStepClaimFinalizer":["FinalizeStepClaim"],
           "EndlessTreasurePhaseState":["BeginStage","get_StageNum","get_PhaseNum"],
           "MetaUnlockGate":["get_IsUnlocked","get_IsPrewarmReached"],
           "SegmentRuntimeState":["Deactivate","Reset"]
          }
          # Native arithmetic/state leaves exercised without invoking the whole original runtime.
          from unicorn import Uc,UC_ARCH_ARM,UC_MODE_ARM,UC_HOOK_CODE
          from unicorn.arm_const import *
          B=0x11000000; OBJ=B+0x1000; STOP=B+0xf000
          def probe(start,end,regs,fields):
           u=Uc(UC_ARCH_ARM,UC_MODE_ARM)
           for p in range(start&~4095,((end-1)&~4095)+4096,4096):
            u.mem_map(p,4096);u.mem_write(p,e[off(p,4096):off(p,4096)+4096])
           u.mem_map(B,0x10000);u.reg_write(UC_ARM_REG_SP,B+0xe000);u.reg_write(UC_ARM_REG_LR,STOP)
           for r,n in regs.items():u.reg_write(r,n&0xffffffff)
           for p,n in fields.items():u.mem_write(p,struct.pack('<I',n&0xffffffff))
           u.emu_start(start,STOP,count=300)
           assert u.reg_read(UC_ARM_REG_PC)==STOP,(hex(start),hex(u.reg_read(UC_ARM_REG_PC)))
           return u
          def rd(u,p):return struct.unpack('<I',u.mem_read(p,4))[0]
          def rr(u,r):return u.reg_read(r)&0xffffffff
          for r in records:
           tn=r['type'];mn=r['method'];a=int(r['rva'],16);key=tn.split('.')[-1]
           if not a or ignore.search(tn) or ignore.search(mn):continue
           i=bisect.bisect_right(starts,a)
           if i>=len(starts):continue
           b=starts[i]
           if b-a<4:continue
           # Expanded Meta and treasure owners; method identity and call summary only.
           if ('.Meta.' in tn or 'EndlessTreasure' in tn) and not re.search(r'View|Presenter|Formatter|Installer|Config|Payload|Widget|Window|Abstractions?\.|Animation|Notification|^<',tn,re.I):
            if not re.match('add_|remove_|get_|set_|\.ctor|\.cctor',mn) and b-a<=0x2000:
             ins=instructions(a,b)
             calls=[[hex(x.address),x.op_str,names_at(int(x.op_str[1:],16))] for x in ins if x.mnemonic.startswith('b') and re.fullmatch(r'#0x[0-9a-f]+',x.op_str)]
             print('META_EXPANDED',json.dumps({'type':tn,'method':mn,'a':hex(a),'b':hex(b),'calls':calls},separators=(',',':')))
           if mn not in target.get(key,[]):continue
           ins=instructions(a,b)
           # Bounded numeric field accesses, comparisons, conditions, RNG calls and control flow; no byte dump.
           facts=[[hex(x.address),x.mnemonic,x.op_str,names_at(int(x.op_str[1:],16)) if x.mnemonic.startswith('b') and re.fullmatch(r'#0x[0-9a-f]+',x.op_str) else []] for x in ins if x.mnemonic.startswith(('b','cmp','cmn','tst','teq','v','mov','add','sub','mul','rsb','and','orr','bic','eor','lsl','asr','lsr','ux','str','ldr'))]
           print('META_FOCUS',json.dumps({'type':tn,'method':mn,'a':hex(a),'b':hex(b),'facts':facts},separators=(',',':')))
          # Verify exact small arithmetic kernels with matrix results; record independent expectations in later report.
          # Use actual method pointer lookup, not guessed offsets.
          def lookup(ty,mn):
           a={int(r['rva'],16) for r in records if r['type'].endswith('.'+ty) and r['method']==mn and int(r['rva'],16)}
           assert len(a)==1,(ty,mn,a)
           a=a.pop();return a,starts[bisect.bisect_right(starts,a)]
          import itertools
          for ty,mn in [('DiggingStageState','Index'),('DiggingStageState','get_CellCount'),('DiggingStageBuilder','InBounds'),('SegmentRuntimeState','Deactivate'),('SegmentRuntimeState','Reset')]:
           a,b=lookup(ty,mn);print('META_LEAF',ty,mn,hex(a),hex(b))
          # Native model-free state flag test with fixed object storage, after inspecting exact class ABI.
          for method,expected in [('Deactivate',0),('Reset',1)]:
           a,b=lookup('SegmentRuntimeState',method);rows=[]
           for prior in (0,1):
            u=probe(a,b,{UC_ARM_REG_R0:OBJ},{OBJ+12:prior})
            val=rd(u,OBJ+12)&255
            assert val==expected,(method,prior,val)
            rows.append([prior,val])
           print('META_NATIVE_SEGMENT',json.dumps({'method':method,'rows':rows},separators=(',',':')))
          print('PASS_META_FOCUSED')
          PY
