name: Isolated reference generator inspection
on:
  push:
    branches: [research/hitapps-generator-native-20261126]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify original public build and inspect numeric source anchors
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --silent --show-error --retry 1 --max-time 100 'https://d.apkpure.net/b/XAPK/com.hitappsgames.wordsolitaire?versionCode=3742' -o "$tmp/source.xapk"
          python3 -m pip install --quiet --disable-pip-version-check 'unicorn==2.1.4' 'capstone==5.0.6'
          python3 - "$tmp/source.xapk" <<'PY'
          import hashlib,struct,sys,zipfile,io,re,bisect,json
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes()
          assert len(raw)==287832513 and hashlib.sha256(raw).hexdigest()=='22aaff3a6d5b70f217b8feb7348538f5ab3352d4e8c766406cbddcbcd71e49f0'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           with zipfile.ZipFile(io.BytesIO(z.read('com.hitappsgames.wordsolitaire.apk'))) as a: md=a.read('assets/bin/Data/Managed/Metadata/global-metadata.dat')
           with zipfile.ZipFile(io.BytesIO(z.read('config.armeabi_v7a.apk'))) as a: e=a.read('lib/armeabi-v7a/libil2cpp.so')
          assert hashlib.sha256(e).hexdigest()=='f25d9a988f6fa61eb201879f72c556a5875a4ac2c5f541670950589afbb51e26'
          assert hashlib.sha256(md).hexdigest()=='47e2db3a792411193b25ed90c590facebcb3af861834eca90cb8e433a8e14aca'
          assert struct.unpack_from('<II',md)==(0xfab11baf,31)
          print('ORIGINAL XAPK AND BOTH PRIVATE NATIVE HASHES MATCH')
          del raw
          ph=struct.unpack_from('<I',e,28)[0];step,num=struct.unpack_from('<HH',e,42)
          seg=[]
          for j in range(num):
           typ,fo,va,_,size,_,flags,_=struct.unpack_from('<8I',e,ph+j*step)
           if typ==1:seg.append((fo,va,size,flags))
          assert [va-fo for fo,va,_,_ in seg]==[0,0x4000,0x8000]
          def off(va,n=4):
           for fo,start,size,_ in seg:
            if start<=va and va+n<=start+size:return fo+va-start
           raise ValueError(hex(va))
          def va(fo):
           for start,v,size,_ in seg:
            if start<=fo<start+size:return v+fo-start
           raise ValueError(hex(fo))
          def word(a):return struct.unpack_from('<I',e,off(a))[0]
          S,SS=struct.unpack_from('<II',md,24);T,TS=struct.unpack_from('<II',md,160)
          M,MS=struct.unpack_from('<II',md,48);I,IS=struct.unpack_from('<II',md,168)
          F,FS=struct.unpack_from('<II',md,96);P,PS=struct.unpack_from('<II',md,88)
          def name(ix):
           if not 0<=ix<SS:return ''
           p=S+ix;return md[p:md.index(b'\0',p,S+SS)].decode()
          images={}
          wanted={}
          for j in range(IS//40):
           row=struct.unpack_from('<10I',md,I+40*j);im=name(row[0]);images[im]=row
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t)
            tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            if re.match(r'^(Game\.|CoreGameplay\.dll|Assembly-CSharp\.dll|GameCore\.)',im) and (re.search(r'(Lives|LifePurchaser|LifeData|LifeReserv|LifeSpend|LifeConfig|LifeRestore|NextDayWaiter|Revive|RestoreStock|ExtraMoves|MovesOffer|MovesLimit|MovesOperations|MoveOperations|MoveCount|MovesSystem|MovesLogic|MoveBudget|UnlimitedMoves|ContinueService|LevelBucketRv|GameplayState|LevelProgress|LevelResult|LevelBootstrapper|UserProgress|PlayerProgress|StockOperations|GameplayController|LevelController|MovesData|StepsData|MovesBalance)',tn,re.I) or any(re.search(r'(AddExtraMoves|AddMoves|SpendMoves|ConsumeMoves|GetMovesLeft|RemainingMoves|PendingRevive|SpendLife|ReserveLife|RestoreStock|OnLevelLost|OnLevelFailed|HandleContinue|OnContinueRequested|OnLevelWon|HandleTryAgain|LevelFinished|ResetMove|FreeRestore)',name(struct.unpack_from('<I',md,M+36*k)[0]),re.I) for k in range(tr[9],tr[9]+(tr[16]&65535)))):
             wanted.setdefault(im,[]).append((tn,tr))
          print('TARGET_IMAGES',list(wanted))
          entries={};records=[];tables={}
          for im,types in wanted.items():
           row=images[im];pos=e.find(im.encode()+b'\0')
           if pos<0:print('NO_MODULE_STRING',im);continue
           marker=struct.pack('<I',va(pos));found=[]
           for fo,v,size,_ in seg[1:]:
            data=e[fo:fo+size];j=-1
            while (j:=data.find(marker,j+1))>=0:
             if j+12>size:continue
             n,p=struct.unpack_from('<II',data,j+4)
             if not 0<n<25000:continue
             try: ptrs=struct.unpack_from('<%dI'%n,e,off(p,n*4))
             except (ValueError,struct.error):continue
             if all(a==0 or 0x148b0b0<=a<0x6a167d0 for a in ptrs):found.append((v+j,n,p,ptrs))
           if len(found)!=1:print('AMBIGUOUS_MODULE',im,len(found));continue
           descriptor,n,table,ptrs=found[0];tables[im]=[hex(descriptor),n,hex(table)]
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t);tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            for i in range(tr[9],tr[9]+(tr[16]&65535)):
             mr=struct.unpack_from('<7I4H',md,M+36*i);rid=mr[6]&0xffffff
             if not 0<rid<=n:continue
             a=ptrs[rid-1];mn=name(mr[0])
             rec={'image':im,'type':tn,'method':mn,'rid':rid,'rva':hex(a),'parameters':[name(struct.unpack_from('<I',md,P+12*(mr[4]+k))[0]) for k in range(mr[-1])]}
             if a:entries.setdefault(a,[]).append(rec)
             if any(tn==x[0] for x in types):records.append(rec)
          print('MODULES',json.dumps(tables))
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM
          d=Cs(CS_ARCH_ARM,CS_MODE_ARM)
          starts=sorted(entries)
          def instructions(a,b):
           return list(d.disasm(e[off(a,b-a):off(a,b-a)+b-a],a))
          def names_at(a):
           return [x['type']+'.'+x['method'] for x in entries.get(a,[])][:2]
          def compact(x):
           # Numeric dataflow anchor; no original instruction bytes or decompiled source.
           op=x.mnemonic
           if op.startswith(('bl','b','cmp','cmn','tst','teq','ldr','str','mov','add','sub','and','orr','bic','eor','rsb','ux','lsl','asr','lsr','mvn','pop','push','stm','ldm','mul')):
            return [hex(x.address),op,x.op_str]
           return None
          # Exact arithmetic and call-boundary source anchors; include VFP in these small methods.
          for a,b,label in [(0x205a544,0x205a630,'revive-amount'),(0x1ffe3d8,0x1ffe53c,'life-price'),(0x200db64,0x200dc00,'restore-price'),(0x200e0c0,0x200e0d8,'restore-reset'),(0x20012f0,0x2001428,'time-refill'),(0x2000570,0x20005fc,'spend-life'),(0x2001824,0x20018e0,'restore-life'),(0x1fffe78,0x1ffff74,'recalculate-timer'),(0x1d75f5c,0x1d75f74,'apply-pending-moves'),(0x1f321a0,0x1f324ac,'bootstrap-restore'),(0x1f32b88,0x1f32e24,'bootstrap-fresh'),(0x1f26a48,0x1f26b90,'next-level'),(0x1f2702c,0x1f27118,'retry'),(0x1f27118,0x1f271c4,'reset-paid'),(0x1f3db38,0x1f3dd68,'stock-click'),(0x20666dc,0x20667b8,'bubble-clear'),(0x1ecc58c,0x1ecc5d0,'bubble-reset-intent')]:
           print('ANCHOR32',json.dumps({'name':label,'a':hex(a),'b':hex(b),'facts':[[hex(x.address),x.mnemonic,x.op_str,names_at(int(x.op_str[1:],16)) if x.mnemonic.startswith('b') and re.fullmatch(r'#0x[0-9a-f]+',x.op_str) else []] for x in instructions(a,b)]},separators=(',',':')))
          # Identify other pool fields from metadata across original game types, not a named-method-only assumption.
          for im,row in images.items():
           if not re.match(r'^(Game\.|CoreGameplay|Assembly-CSharp|GameCore\.)',im):continue
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t);tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            if re.search(r'Formatter|\.Migration|\._1_13_0\.|Cheat|\.Analytics\.|\.Tests|^<',tn):continue
            fields=[name(struct.unpack_from('<I',md,F+fi*12)[0]) for fi in range(tr[8],tr[8]+(tr[17]&65535)) if 0<=fi<FS//12]
            matches=[f for f in fields if not f.startswith('__') and re.search(r'(extra.*move|move.*(pool|balance|bank|reserv|carry|remain|available|limit|purchas|add)|pending.*move|remaining.*(step|move)|reservedLives|LivesReservation|paidRestoreCount|restor.*count|step.*limit)',f,re.I)]
            if matches:print('FIELD32',json.dumps({'image':im,'type':tn,'fields':matches},separators=(',',':')))
          # Source-pinned ARM32 bounded execution of numeric write slices and resolved accessor boundaries.
          from unicorn import Uc,UC_ARCH_ARM,UC_MODE_ARM,UC_HOOK_CODE
          from unicorn.arm_const import *
          import itertools,math
          B=0x11000000; STOP=B+0xf0000; OBJ=B+0x1000; DATA=B+0x2000; CFG=B+0x3000
          def setup(ranges):
           u=Uc(UC_ARCH_ARM,UC_MODE_ARM);u.mem_map(B,0x100000);u.reg_write(UC_ARM_REG_SP,B+0xe0000);u.reg_write(UC_ARM_REG_LR,STOP);u.reg_write(UC_ARM_REG_FPEXC,0x40000000)
           pages=set()
           for a,b in ranges:
            for p in range(a&~4095,((b+4095)//4096)*4096,4096):
             if p not in pages:u.mem_map(p,4096);u.mem_write(p,e[off(p,4096):off(p,4096)+4096]);pages.add(p)
           return u
          def wr(u,p,v):u.mem_write(p,struct.pack('<I',v&0xffffffff))
          def wh(u,p,v):u.mem_write(p,struct.pack('<H',v&65535))
          def wb(u,p,v):u.mem_write(p,bytes([v&255]))
          def wq(u,p,v):u.mem_write(p,struct.pack('<Q',v&0xffffffffffffffff))
          def rd(u,p):return struct.unpack('<I',u.mem_read(p,4))[0]
          def rh(u,p):return struct.unpack('<H',u.mem_read(p,2))[0]
          def rb(u,p):return u.mem_read(p,1)[0]
          def rq(u,p):return struct.unpack('<Q',u.mem_read(p,8))[0]
          def rr(u,r):return u.reg_read(r)
          def reg(u,r,v):u.reg_write(r,v&0xffffffff)
          def args(u,*vs):
           for r,v in zip((UC_ARM_REG_R0,UC_ARM_REG_R1,UC_ARM_REG_R2,UC_ARM_REG_R3),vs):reg(u,r,v)
          def run(u,a,end,skips=None,calls=None,stops=(),count=400):
           skips=skips or {};calls=calls or {};trace=[]
           def hook(uc,pc,size,user):
            if pc in stops:trace.append(pc);uc.emu_stop();return
            if pc in skips:
             item=skips[pc]
             if callable(item):item(uc)
             else:reg(uc,UC_ARM_REG_PC,item)
            elif pc in calls:
             item=calls[pc];trace.append(pc)
             if callable(item):item(uc)
             else:reg(uc,UC_ARM_REG_R0,item)
             reg(uc,UC_ARM_REG_PC,rr(uc,UC_ARM_REG_LR))
           u.hook_add(UC_HOOK_CODE,hook);u.emu_start(a,end,count=count)
           assert rr(u,UC_ARM_REG_PC)==end or rr(u,UC_ARM_REG_PC) in stops,(hex(a),hex(rr(u,UC_ARM_REG_PC)),trace)
           return trace
          rows={}
          def out(k,v):rows[k]=v;print(k,json.dumps(v,separators=(',',':')))
          moves=[]
          for n in [0,1,2,99,65534,65535]:
           u=setup([(0x1d02530,0x1d02548)]);wh(u,DATA+8,n);reg(u,UC_ARM_REG_R4,DATA);run(u,0x1d02530,0x1d02548);got=rh(u,DATA+8);assert got==max(1,(n+1)&65535);moves.append([n,got])
          out('MOVE32',moves)
          pending=[]
          for limit,extra,prior in itertools.product((0,1,10,100,500),(0,1,5,20),(0,1,99)):
           u=setup([(0x1d75f5c,0x1d75f74)]);wr(u,OBJ+0x30,limit);wr(u,OBJ+0x44,prior);args(u,OBJ,extra);run(u,0x1d75f5c,STOP);got=[rd(u,OBJ+0x30),rd(u,OBJ+0x44)];assert got==[limit+extra,0];pending.append([limit,extra,prior,*got])
          out('PENDING32',pending)
          bubble=[]
          for flag,n,old in itertools.product((0,1),(-1,0,1,5,50),(0,1)):
           u=setup([(0x2066648,0x20666c4),(0x2065224,0x2065228)]);wb(u,DATA+8,flag);wr(u,DATA+0xc,n);wb(u,OBJ+0x28,old);args(u,OBJ);run(u,0x2066648,STOP,calls={0x2065224:DATA});got=[rr(u,UC_ARM_REG_R0),rb(u,OBJ+0x28),rd(u,DATA+0xc),rb(u,DATA+8)];allowed=flag and n>=1;assert got==[n if allowed else 0,1 if allowed else old,n&0xffffffff,flag];bubble.append([flag,n,old,*got])
          out('BUBBLE32',bubble)
          reset=[]
          for old in (0,1):
           u=setup([(0x20666c4,0x20666dc)]);wb(u,OBJ+0x28,old);args(u,OBJ);run(u,0x20666c4,STOP,stops=(0x20666dc,));got=[rb(u,OBJ+0x28),int(rr(u,UC_ARM_REG_PC)==0x20666dc)];assert got==[0,old];reset.append([old,*got])
          out('BUBBLERESET32',reset)
          restock=[]
          for count,enabled,success,cost in itertools.product((0,1,2,10),(0,1),(0,1),(0,100,350)):
           u=setup([(0x200dcb0,0x200ddf8),(0x200d9b8,0x200d9bc),(0x200db64,0x200db68)])
           wr(u,OBJ+0x1c,count);wr(u,OBJ+0x18,999);reg(u,UC_ARM_REG_R4,OBJ);reg(u,UC_ARM_REG_R8,cost)
           # The original purchase gate invokes provider; start after method prologue, stop before epilogue.
           def spend(uc):reg(uc,UC_ARM_REG_R8,cost);reg(uc,UC_ARM_REG_R0,success);reg(uc,UC_ARM_REG_PC,0x200dde0)
           run(u,0x200dcb0,0x200ddf4,{0x200dcf0:spend},{0x200d9b8:enabled,0x200db64:cost})
           got=[rr(u,UC_ARM_REG_R0),rd(u,OBJ+0x1c),rd(u,OBJ+0x18)]
           ex=[1,count,0] if not enabled else [1,1,0] if count==0 else [success,count+success,cost]
           assert got==ex,(got,ex);restock.append([count,enabled,success,cost,*got])
          out('RESTOCK32',restock)
          refund=[]
          for count,enabled in itertools.product((0,1,2,10),(0,1)):
           u=setup([(0x200de70,0x200de98),(0x200d9b8,0x200d9bc)]);wr(u,OBJ+0x1c,count);reg(u,UC_ARM_REG_R4,OBJ)
           run(u,0x200de70,0x200de98,calls={0x200d9b8:enabled},stops=(0x200df98,))
           got=[rd(u,OBJ+0x1c),int(rr(u,UC_ARM_REG_PC)==0x200de98)];ex=[count-1 if enabled and count>=1 else count,int(enabled and count>1)];assert got==ex;refund.append([count,enabled,*got])
          out('REFUND32',refund)
          clamp=[]
          for old,amount,cap,add in itertools.product((0,1,3,5,10),(0,1,2,5),(1,3,5),(0,1)):
           if add and old>=cap:continue # full-life early gate excluded from write slice
           u=setup([(0x2000c14,0x2000c6c)] if add else [(0x2000704,0x200075c)])
           if add:
            reg(u,UC_ARM_REG_R5,old);reg(u,UC_ARM_REG_R7,cap);reg(u,UC_ARM_REG_R10,amount);reg(u,UC_ARM_REG_R8,DATA);run(u,0x2000c14,0x2000c6c)
           else:
            reg(u,UC_ARM_REG_R7,old);reg(u,UC_ARM_REG_R6,cap);reg(u,UC_ARM_REG_R8,amount);reg(u,UC_ARM_REG_R10,DATA);run(u,0x2000704,0x200075c)
           got=rd(u,DATA+8);assert got==max(0,min(cap,old+amount if add else old-amount));clamp.append([old,amount,cap,add,got])
          out('LIFECLAMP32',clamp)
          infinite=[]
          for now,prev,duration in itertools.product((100,2**32+100),(0,99,100,101,2**32+200),(1,60,3600)):
           u=setup([(0x2005380,0x20053c8),(0x20047f4,0x20047f8)])
           wq(u,DATA+0x28,prev);reg(u,UC_ARM_REG_R6,DATA);reg(u,UC_ARM_REG_R4,OBJ);reg(u,UC_ARM_REG_R5,now);reg(u,UC_ARM_REG_R7,now>>32);reg(u,UC_ARM_REG_R8,duration)
           run(u,0x2005380,0x20053c8,calls={0x20047f4:DATA})
           got=rq(u,DATA+0x28);ex=max(now,prev)+duration;assert got==ex,(now,prev,duration,got,ex);infinite.append([now,prev,duration,got])
          out('INFINITE32',infinite)
          resetday=[]
          for now,deadline in itertools.product((0,100,101,2**32+100),(0,99,100,101,2**32+100)):
           u=setup([(0x1fff74c,0x1fff7b4),(0x1ffe948,0x1ffe94c)])
           wq(u,DATA+0x18,deadline);args(u,OBJ,0,now,now>>32);run(u,0x1fff74c,STOP,calls={0x1ffe948:DATA});got=rr(u,UC_ARM_REG_R0);assert got==int(deadline!=0 and deadline<now),(now,deadline,got);resetday.append([now,deadline,got])
          out('DAY32',resetday)
          def f32(x):return struct.unpack('<f',struct.pack('<f',x))[0]
          def fbits(x):return struct.unpack('<I',struct.pack('<f',x))[0]
          def fl(x):return struct.unpack('<f',struct.pack('<I',x))[0]
          def ceilf(u):reg(u,UC_ARM_REG_R0,fbits(math.ceil(fl(rr(u,UC_ARM_REG_R0)))))
          def powf(u):reg(u,UC_ARM_REG_R0,fbits(fl(rr(u,UC_ARM_REG_R0))**fl(rr(u,UC_ARM_REG_R1))))
          # Both imported functions were resolved by earlier SHA-identical source runs.
          revive=[]
          for remaining,coef,cap in itertools.product((0,1,4,5,6,10,11,31,99),(.1,.25,.5,1,1.2,2.5),(0,5,10,20,100)):
           u=setup([(0x205a5d0,0x205a618),(0x2b4a9a4,0x2b4a9a8)])
           reg(u,UC_ARM_REG_R5,remaining);reg(u,UC_ARM_REG_R4,CFG);reg(u,UC_ARM_REG_S16,fbits(coef));wr(u,CFG+0x24,cap)
           run(u,0x205a5d0,0x205a618,calls={0x2b4a9a4:ceilf})
           got=rr(u,UC_ARM_REG_R0);ex=min(cap,5*math.ceil(f32(f32(f32(coef)*f32(remaining))/5)))
           assert got==ex,(remaining,coef,cap,got,ex);revive.append([remaining,coef,cap,got])
          out('REVIVE32',revive)
          prices=[]
          for count,base,inc in itertools.product((0,1,2,3,10),(0,50,300),(0,25,100)):
           if count==0:
            u=setup([(0x200db64,0x200dc00)]);wr(u,OBJ+0x1c,0);args(u,OBJ);run(u,0x200db64,STOP)
           else:
            u=setup([(0x200dbe8,0x200dbf4)]);reg(u,UC_ARM_REG_R4,CFG);reg(u,UC_ARM_REG_R6,base);reg(u,UC_ARM_REG_R7,count);wr(u,CFG+0x38,inc);run(u,0x200dbe8,0x200dbf4)
           got=rr(u,UC_ARM_REG_R0);assert got==(0 if not count else base+(count-1)*inc);prices.append([count,base,inc,got])
          out('RESTPRICE32',prices)
          exponents=[]
          for base,n,cap,coef in itertools.product((1,9,15,51,100),(0,1,2,4,8),(0,2,5),(1,1.15,1.5,2)):
           u=setup([(0x1ffe3e4,0x1ffe440),(0x2b4c8d0,0x2b4c8d4)])
           args(u,base,n,cap,fbits(coef))
           run(u,0x1ffe3e4,0x1ffe440,skips={0x1ffe408:0x1ffe40c,0x1ffe414:0x1ffe43c},calls={0x2b4c8d0:powf})
           got=fl(rr(u,UC_ARM_REG_S18));ex=f32(f32(base)*f32(f32(coef)**f32(min(n,cap))))
           assert got==ex,(base,n,cap,coef,got,ex);exponents.append([base,n,cap,coef,got])
          out('LIFEEXP32',exponents)
          rounding=[]
          for n in range(121):
           u=setup([(0x1ffe4fc,0x1ffe51c)]);args(u,n);run(u,0x1ffe4fc,0x1ffe51c)
           got=rr(u,UC_ARM_REG_R0);assert got==(n if n<10 else n//10*10);rounding.append([n,got])
          out('LIFEROUND32',rounding)
          resets=[]
          for count,cost in itertools.product((0,1,3,100),(0,25,100)):
           u=setup([(0x200e0c0,0x200e0cc)]);wr(u,OBJ+0x1c,count);wr(u,OBJ+0x18,cost);args(u,OBJ);run(u,0x200e0c0,STOP)
           got=[rd(u,OBJ+0x1c),rd(u,OBJ+0x18)];assert got==[0,cost];resets.append([count,cost,*got])
          out('RESTRESET32',resets)
          print('PASS_SHA_PINNED_RECOVERY_KERNELS32',json.dumps({k:len(v) for k,v in rows.items()}))
          PY
