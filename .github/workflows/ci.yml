name: Verify and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore the accepted pinned dependency cache without writing private source back
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.npm
          key: node-cache-Linux-x64-npm-a4df24577ed48de6d871f0577006637c44d25e4ee405b275d4a7b579b77d534b
      - name: Verify all referenced source systems are represented in the real consumer roadmap
        run: node tools/qa/verify-porting-ledger.mjs
      - name: Verify autonomous 114-feature 38-packet developer queue
        run: node tools/qa/verify-delivery-queue.mjs
      - run: node --test tests/infrastructure/*.test.mjs
      - name: Report legacy published-passport choice evidence (non-blocking quality warning)
        run: node tools/qa/audit-c8-decision-evidence.mjs
      - run: node tools/install-dependencies.mjs
        env:
          MINI_GAMES_KIT_READ_TOKEN: ${{ secrets.MINI_GAMES_KIT_READ_TOKEN }}
          ASOC_KIT_OFFLINE_CACHE: '1'
      - run: npm run check
      - name: Research Q1b full C8 decision continuations and witness-relative route cost
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'audit/c8-q1b-')
        env:
          VITE_CONTENT8_PREVIEW: '1'
        run: |
          npm run qa:campaign-decisions
          node tools/qa/summarize-c8-route-cost.mjs
      - name: Research Q1c finite-budget comparison and deeper unknown transfer probes
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'audit/c8-q1c-')
        env:
          VITE_CONTENT8_PREVIEW: '1'
        run: |
          npm run qa:campaign-decisions
          node tools/qa/summarize-c8-route-cost.mjs
          npm run qa:decision-cost
          npm run qa:decision-deep
      - run: npm run qa:rules
      - run: npm run content:azur-preset
      - run: npm run qa:azur-ordinary
      - run: npm run qa:content8
      - run: npm run qa:content7
      - run: npm run qa:opening
      - run: npm run qa:prototypes:build
      - run: npm run qa:prototypes:validate
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:layout
      - run: npm run test:browser
      - run: npm run qa:content7
        env:
          C7_REQUIRE_UI: '1'
      - name: Verify the Content 8 preview with actual touch input
        if: startsWith(github.head_ref || github.ref_name, 'feat/c8-') || startsWith(github.head_ref || github.ref_name, 'audit/c8-') || startsWith(github.head_ref || github.ref_name, 'docs/c8-') || github.base_ref == 'feat/c8-onboarding-dealer-20261119'
        env:
          VITE_CONTENT8_PREVIEW: '1'
        run: |
          npm run build
          npx playwright test tests/browser/content8-core.spec.ts --output=test-results/content8-core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            .recording/layout-audit/
            .recording/content7-ui/
            .recording/content7-recordings/
            .authoring/content8/campaign-decisions.json
            .authoring/content8/campaign-decision-cost.json
            .authoring/content8/campaign-unknown-transfer-deep.json
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore the accepted pinned dependency cache without writing private source back
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.npm
          key: node-cache-Linux-x64-npm-a4df24577ed48de6d871f0577006637c44d25e4ee405b275d4a7b579b77d534b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: node --test tests/infrastructure/*.test.mjs
      - run: node tools/install-dependencies.mjs
        env:
          MINI_GAMES_KIT_READ_TOKEN: ${{ secrets.MINI_GAMES_KIT_READ_TOKEN }}
          ASOC_KIT_OFFLINE_CACHE: '1'
      - run: npm run android:sync
        env:
          VITE_CONTENT8_PREVIEW: ${{ (startsWith(github.head_ref || github.ref_name, 'feat/c8-') || startsWith(github.head_ref || github.ref_name, 'audit/c8-') || startsWith(github.head_ref || github.ref_name, 'docs/c8-') || github.ref_name == 'feat/content8-reference-slice-20261119' || github.head_ref == 'feat/content8-reference-slice-20261119' || github.base_ref == 'feat/c8-onboarding-dealer-20261119') && '1' || '0' }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/asoc-debug-signing/debug.keystore
          key: asoc-solitair-preview-signing-v2
      - name: Ensure the explicit preview signing key exists
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/asoc-debug-signing"
          if [ ! -s "$RUNNER_TEMP/asoc-debug-signing/debug.keystore" ]; then
            echo '::error::The existing preview signing identity is required; do not generate a replacement key.'
            exit 1
          fi
      - name: Build signed preview APK
        shell: bash
        run: |
          if ./gradlew --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/asoc-gradle.log"; then
            exit 0
          fi
          grep -q 'https://repo.maven.apache.org/maven2' "$RUNNER_TEMP/asoc-gradle.log"
          ASOC_MAVEN_CENTRAL_MIRROR=1 ./gradlew --no-daemon assembleDebug
          echo 'ASOC_MAVEN_CENTRAL_MIRROR=1' >> "$GITHUB_ENV"
        working-directory: native/android
        env:
          ASOC_AD_MODE: test
          ASOC_DEBUG_STORE_FILE: ${{ runner.temp }}/asoc-debug-signing/debug.keystore
      - name: Verify the preview APK signature
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs native/android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs native/android/app/build/outputs/apk/debug/app-debug.apk | grep -F '0335b87262e17f94803da322f0b8a0ca6ad04101246d0e701f3fc7d358a8b64e'
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging native/android/app/build/outputs/apk/debug/app-debug.apk | head -1
      - run: ./gradlew --no-daemon assembleRelease
        working-directory: native/android
        env:
          ASOC_AD_MODE: disabled
          ASOC_UNSIGNED_CHECK: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-builds
          path: |
            native/android/app/build/outputs/apk/**/*.apk
            native/android/app/build/outputs/mapping/release/
          retention-days: 7
