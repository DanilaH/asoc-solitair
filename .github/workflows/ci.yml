name: Verify and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run qa:prototypes:build
      - run: npm run qa:prototypes:validate
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:layout
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            .recording/layout-audit/
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --no-audit --no-fund
      - run: npm run android:sync
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/asoc-debug-signing/debug.keystore
          key: asoc-solitair-preview-signing-v2
      - name: Ensure the explicit preview signing key exists
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/asoc-debug-signing"
          if [ ! -s "$RUNNER_TEMP/asoc-debug-signing/debug.keystore" ]; then
            keytool -genkeypair -noprompt -storetype JKS \
              -keystore "$RUNNER_TEMP/asoc-debug-signing/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: ./gradlew --no-daemon assembleDebug
        working-directory: native/android
        env:
          ASOC_AD_MODE: test
          ASOC_DEBUG_STORE_FILE: ${{ runner.temp }}/asoc-debug-signing/debug.keystore
      - name: Verify the preview APK signature
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs native/android/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging native/android/app/build/outputs/apk/debug/app-debug.apk | head -1
      - run: ./gradlew --no-daemon assembleRelease
        working-directory: native/android
        env:
          ASOC_AD_MODE: disabled
          ASOC_UNSIGNED_CHECK: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-builds
          path: |
            native/android/app/build/outputs/apk/**/*.apk
            native/android/app/build/outputs/mapping/release/
          retention-days: 7
