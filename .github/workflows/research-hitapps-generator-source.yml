name: Isolated Hitapps commerce research
on:
  pull_request:
    branches: [research/hitapps-meta-native-20261127]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify original public build and inspect numeric source anchors
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --silent --show-error --retry 1 --max-time 100 'https://d.apkpure.net/b/XAPK/com.hitappsgames.wordsolitaire?versionCode=3742' -o "$tmp/source.xapk"
          python3 -m pip install --quiet --disable-pip-version-check 'unicorn==2.1.4' 'capstone==5.0.6'
          python3 - "$tmp/source.xapk" <<'PY'
          import hashlib,struct,sys,zipfile,io,re,bisect,json
          from pathlib import Path
          raw=Path(sys.argv[1]).read_bytes()
          assert len(raw)==287832513 and hashlib.sha256(raw).hexdigest()=='22aaff3a6d5b70f217b8feb7348538f5ab3352d4e8c766406cbddcbcd71e49f0'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
           with zipfile.ZipFile(io.BytesIO(z.read('com.hitappsgames.wordsolitaire.apk'))) as a: md=a.read('assets/bin/Data/Managed/Metadata/global-metadata.dat')
           with zipfile.ZipFile(io.BytesIO(z.read('config.armeabi_v7a.apk'))) as a: e=a.read('lib/armeabi-v7a/libil2cpp.so')
          assert hashlib.sha256(e).hexdigest()=='f25d9a988f6fa61eb201879f72c556a5875a4ac2c5f541670950589afbb51e26'
          assert hashlib.sha256(md).hexdigest()=='47e2db3a792411193b25ed90c590facebcb3af861834eca90cb8e433a8e14aca'
          assert struct.unpack_from('<II',md)==(0xfab11baf,31)
          print('ORIGINAL XAPK AND BOTH PRIVATE NATIVE HASHES MATCH')
          del raw
          ph=struct.unpack_from('<I',e,28)[0];step,num=struct.unpack_from('<HH',e,42)
          seg=[]
          for j in range(num):
           typ,fo,va,_,size,_,flags,_=struct.unpack_from('<8I',e,ph+j*step)
           if typ==1:seg.append((fo,va,size,flags))
          assert [va-fo for fo,va,_,_ in seg]==[0,0x4000,0x8000]
          def off(va,n=4):
           for fo,start,size,_ in seg:
            if start<=va and va+n<=start+size:return fo+va-start
           raise ValueError(hex(va))
          def va(fo):
           for start,v,size,_ in seg:
            if start<=fo<start+size:return v+fo-start
           raise ValueError(hex(fo))
          def word(a):return struct.unpack_from('<I',e,off(a))[0]
          S,SS=struct.unpack_from('<II',md,24);T,TS=struct.unpack_from('<II',md,160)
          M,MS=struct.unpack_from('<II',md,48);I,IS=struct.unpack_from('<II',md,168)
          F,FS=struct.unpack_from('<II',md,96);P,PS=struct.unpack_from('<II',md,88)
          def name(ix):
           if not 0<=ix<SS:return ''
           p=S+ix;return md[p:md.index(b'\0',p,S+SS)].decode()
          images={}
          wanted={}
          for j in range(IS//40):
           row=struct.unpack_from('<10I',md,I+40*j);im=name(row[0]);images[im]=row
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t)
            tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            if re.match(r'^(Game\.|CoreGameplay\.dll|Assembly-CSharp\.dll|GameCore\.)',im) and (re.search(r'(PiggyBank|StarterOffer|DecoyOffer|BirthdayOffer|BuyAll|OfferShowIteration|PayerRvLimit|PayerType|PayerSegment|WinScreenRvReward|AdsLimitation|AdsBreak|NoAds|PurchaseOrchestrator|PurchaseRewardProcessor|StoreProductExcluder|OfferConfig|OfferService|OfferSystem)',tn,re.I) or any(re.search(r'(PiggyBank|StarterOffer|DecoyOffer|BirthdayOffer|BuyAll|OfferShowIteration|PayerRvLimit|PayerType|PayerSegment|WinScreenRvReward|AdsLimitation|AdsBreak|NoAds|PurchaseOrchestrator|PurchaseRewardProcessor|StoreProductExcluder|OfferConfig|OfferService|OfferSystem)',name(struct.unpack_from('<I',md,M+36*k)[0]),re.I) for k in range(tr[9],tr[9]+(tr[16]&65535)))):
             wanted.setdefault(im,[]).append((tn,tr))
          print('TARGET_IMAGES',list(wanted))
          entries={};records=[];tables={}
          for im,types in wanted.items():
           row=images[im];pos=e.find(im.encode()+b'\0')
           if pos<0:print('NO_MODULE_STRING',im);continue
           marker=struct.pack('<I',va(pos));found=[]
           for fo,v,size,_ in seg[1:]:
            data=e[fo:fo+size];j=-1
            while (j:=data.find(marker,j+1))>=0:
             if j+12>size:continue
             n,p=struct.unpack_from('<II',data,j+4)
             if not 0<n<25000:continue
             try: ptrs=struct.unpack_from('<%dI'%n,e,off(p,n*4))
             except (ValueError,struct.error):continue
             if all(a==0 or 0x148b0b0<=a<0x6a167d0 for a in ptrs):found.append((v+j,n,p,ptrs))
           if len(found)!=1:print('AMBIGUOUS_MODULE',im,len(found));continue
           descriptor,n,table,ptrs=found[0];tables[im]=[hex(descriptor),n,hex(table)]
           for t in range(row[2],row[2]+row[3]):
            tr=struct.unpack_from('<22I',md,T+88*t);tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            for i in range(tr[9],tr[9]+(tr[16]&65535)):
             mr=struct.unpack_from('<7I4H',md,M+36*i);rid=mr[6]&0xffffff
             if not 0<rid<=n:continue
             a=ptrs[rid-1];mn=name(mr[0])
             rec={'image':im,'type':tn,'method':mn,'rid':rid,'rva':hex(a),'parameters':[name(struct.unpack_from('<I',md,P+12*(mr[4]+k))[0]) for k in range(mr[-1])]}
             if a:entries.setdefault(a,[]).append(rec)
             if any(tn==x[0] for x in types):records.append(rec)
          print('MODULES',json.dumps(tables))
          from capstone import Cs,CS_ARCH_ARM,CS_MODE_ARM
          d=Cs(CS_ARCH_ARM,CS_MODE_ARM)
          starts=sorted(entries)
          def instructions(a,b):
           return list(d.disasm(e[off(a,b-a):off(a,b-a)+b-a],a))
          def names_at(a):
           return [x['type']+'.'+x['method'] for x in entries.get(a,[])][:2]
          def compact(x):
           # Numeric dataflow anchor; no original instruction bytes or decompiled source.
           op=x.mnemonic
           if op.startswith(('bl','b','cmp','cmn','tst','teq','ldr','str','mov','add','sub','and','orr','bic','eor','rsb','ux','lsl','asr','lsr','mvn','pop','push','stm','ldm','mul')):
            return [hex(x.address),op,x.op_str]
           return None
          ignore=re.compile(r'Formatter|Migrator|\.Migration\.|\.Cheat|\.Sample\.|\.Analytics\.|\.AJson|\.Mock|\.Tests|\._1_13_0\.|__AJson|global::',re.I)
          focus=re.compile(r'(PiggyBank|StarterOffer|DecoyOffer|BirthdayOffer|BuyAll|OfferShowIteration|PayerRvLimit|PayerType|PayerSegment|WinScreenRvReward|AdsLimitation|AdsBreak|NoAds|PurchaseOrchestrator|PurchaseRewardProcessor|StoreProductExcluder|OfferConfig|OfferService|OfferSystem)',re.I)
          for im,types in wanted.items():
           for tn,tr in types:
            if ignore.search(tn):continue
            ms=[r for r in records if r['image']==im and r['type']==tn]
            fields=[name(struct.unpack_from('<I',md,F+fi*12)[0]) for fi in range(tr[8],tr[8]+(tr[17]&65535)) if 0<=fi<FS//12]
            if focus.search(tn) or any(focus.search(r['method']) for r in ms):
             print('COM_TYPE',json.dumps({'image':im,'type':tn,'fields':[f for f in fields if not f.startswith('__')],'methods':[[r['method'],r['rva'],r['parameters']] for r in ms if not ignore.search(r['method']) and not re.match('add_|remove_',r['method'])]},separators=(',',':')))
          focus={
           "PiggyBankAvailabilityProvider":["EvaluateAvailability"],
           "PiggyBankService":["ApplyCoinsProgressInternal","IsPurchaseAvailable","GetCoinsProgress","IsAvailableOnRevive"],
           "PiggyBankLifecycleController":["EvaluateActivationInternal","TryResolveNextOfferState","CanActivateNextOfferInCurrentPeriod","SaveOffer","ApplyNewShow"],
           "PiggyBankRewardProvider":["GetValidContent","GetNextAvailableOfferTypeIndex","GetNextAvailableOfferTypeIndexCycled","GetCurrentOfferContentRewards","GetAllCurrentRewards","GetPurchaseRewards","TryPinPurchase"],
           "StarterOfferAvailabilityProvider":["EvaluateAvailability"],
           "StarterOfferLifecycleController":["EvaluateActivationInternal","CanAdvanceToNextOffer","TryGetCurrentOfferData","ApplyNewShow","SaveOfferShow"],
           "StarterOfferRewardProvider":["GetValidContent","TryGetFirstShowableOffer","GetNextAvailableOfferTypeIndex","GetPurchaseRewards","TryPinPurchase","GetCurrentExtraMovesBubble"],
           "DecoyOfferAvailabilityProvider":["EvaluateAvailability"],
           "DecoyOfferLifecycleController":["get_IsShowAllowedByTheNumberOfAttempts","EvaluateActivationInternal","ApplyShow","TryScheduleNextOffer"],
           "DecoyOfferRewardProvider":["SelectBestContent","GetPurchaseRewards","TryPinPurchase"],
           "BirthdayOfferAvailabilityProvider":["CanStartNewShow","IsAvailable","IsPurchased"],
           "BirthdayOfferLifecycleController":["TryFindEligibleEditionForNewShow","IsEditionFresh","ApplyShow"],
           "BirthdayOfferRewardProvider":["SelectBestContent","GetPurchaseRewards","TryPinPurchase"],
           "BuyAllContentSelector":["TrySelectOptions"],
           "BuyAllConfigParser":["ParseEvent","ParseOfferType"],
           "BuyAllVariantSaveData":["ResetWindow"],
           "BuyAllWindowLoop":["RunAsync"],
           "OfferShowIterationDataExtensions":["GetShowTimes","FindEntry","RegisterShow"],
           "RecentPayerDetector":["IsRecentPayer"],
           "PayerRvLimitPolicyService":["RemainingToday","CanWatchNow","CommitOneWatch","IsOverrideActive","ResolveLimits","DailyResetIfNeeded"],
           "PayerAwareRvLimitExtensions":["CommitEffectiveWatch","IsEffectiveLimitReached","CanWatchEffective","GetEffectiveRemaining"],
           "WinScreenRvRewardServiceEnable":["IsEnabled","IsAdsLimitNotReached","GetRewardResult","ApplyWatchedReward"],
           "WinScreenRvRewardResult":["get_ExtraRewardCount",".ctor"],
           "AdsBreakService":["IsInterLimitReached","IsAvailable"],
           "AdsLimitationService":["IsLimitReached","Reset","RegisterShow"]
          }
          for r in records:
           key=r['type'].split('.')[-1];mn=r['method'];a=int(r['rva'],16)
           if not a or mn not in focus.get(key,[]):continue
           i=bisect.bisect_right(starts,a)
           if i>=len(starts):continue
           b=starts[i]
           if b<=a or b-a>0x4000:continue
           ins=instructions(a,b)
           facts=[[hex(x.address),x.mnemonic,x.op_str,names_at(int(x.op_str[1:],16)) if x.mnemonic.startswith('b') and re.fullmatch(r'#0x[0-9a-f]+',x.op_str) else []] for x in ins]
           print('COM_FULL',json.dumps({'type':r['type'],'method':mn,'a':hex(a),'b':hex(b),'facts':facts},separators=(',',':')))
          # Exact source import resolution (reuse prior ELF relocation reader).
          from capstone.arm import ARM_OP_IMM,ARM_OP_MEM
          d.detail=True
          def imm(w):return ((w>>4)&0xf000)|(w&0xfff)
          def veneer(a):
           w,x,y,z=[word(a+4*i) for i in range(4)]
           if w&0xfff0f000==0xe300c000 and x&0xfff0f000==0xe340c000 and y==0xe08cc00f and z==0xe12fff1c:return (a+16+imm(w)+(imm(x)<<16))&0xffffffff
           if w&0xff000000==0xea000000:return a+8+4*(((w&0xffffff)^0x800000)-0x800000)
           return None
          sh=struct.unpack_from('<I',e,32)[0];ents,n,si=struct.unpack_from('<HHH',e,46)
          sections=[struct.unpack_from('<10I',e,sh+i*ents) for i in range(n)];st=sections[si];strings=e[st[4]:st[4]+st[5]]
          def cstr(data,i):return data[i:data.index(b'\0',i)].decode('utf-8','replace')
          byname={cstr(strings,x[0]):x for x in sections};ds=byname['.dynsym'];dt=sections[ds[6]];strs=e[dt[4]:dt[4]+dt[5]]
          rel={}
          for sec in sections:
           if sec[1] not in (4,9) or sec[6]!=sections.index(ds):continue
           for pos in range(sec[4],sec[4]+sec[5],sec[9]):
            addr,info=struct.unpack_from('<II',e,pos);ix=info>>8;row=struct.unpack_from('<IIIBBH',e,ds[4]+ix*ds[9]);rel[addr]=cstr(strs,row[0])
          def import_name(a):
           ip=got=None
           for x in instructions(a,a+16):
            op=x.operands
            if x.mnemonic=='add' and len(op)==3 and x.reg_name(op[0].reg)=='ip' and op[2].type==ARM_OP_IMM:
             src=x.reg_name(op[1].reg)
             if src=='pc':ip=x.address+8+op[2].imm
             elif src=='ip' and ip is not None:ip+=op[2].imm
            elif x.mnemonic.startswith('ldr') and len(op)==2 and op[1].type==ARM_OP_MEM and x.reg_name(op[0].reg)=='pc':
             if x.reg_name(op[1].mem.base)=='ip' and ip is not None:got=(ip+op[1].mem.disp)&0xffffffff;break
           return rel.get(got)
          print('COM_ROUND',json.dumps({'address':'0x2b4a9a4','symbol':import_name(veneer(0x2b4a9a4))}))
          print('PASS_COMMERCE_FOCUS')
          PY
