           u=setup([(0x1c83f50,0x1c83f5c),(0x1c83fac,0x1c83fbc)]);wb(u,G+0x12,h);reg(u,UC_ARM_REG_R5,G);run(u,0x1c83f50,0x1c83f5c,stops=(0x1c83e9c,0x1c83fbc));ev={0x1c83f5c:2,0x1c83fbc:3,0x1c83e9c:0}[rr(u,UC_ARM_REG_PC)];assert ev==(2 if h==1 else 3 if h==0 else 0)
