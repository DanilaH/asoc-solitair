           def initial(u):reg(u,UC_ARM_REG_R1,rr(u,UC_ARM_REG_R6)&65535);reg(u,UC_ARM_REG_PC,0x1c7b310)
           run(u,0x1c7b274,STOP,{0x1c7b290:0x1c7b2d4,0x1c7b2f0:initial,0x1c7b360:skipread(UC_ARM_REG_R1,UC_ARM_REG_R6,0x1c7b380),0x1c7b3a4:skipread(UC_ARM_REG_R1,UC_ARM_REG_R7,0x1c7b3b8),0x1c7b3cc:skipread(UC_ARM_REG_R1,UC_ARM_REG_R10,0x1c7b3e4),0x1c7b404:0x1c7b40c,0x1c7b414:0x1c7b42c,0x1c7b42c:lambda u:(reg(u,UC_ARM_REG_R1,value(u,rr(u,UC_ARM_REG_SP))),reg(u,UC_ARM_REG_R0,rr(u,UC_ARM_REG_SP)+0xa),reg(u,UC_ARM_REG_PC,0x1c7b43c)),0x1c7b47c:skipread(UC_ARM_REG_R1,UC_ARM_REG_R7,0x1c7b490)},{0x2b4c7bc:lookup,0x2b4c7b8:G,0x3b40e44:idx,0x38b4f94:compare},count=800)
           return rr(u,UC_ARM_REG_R0),half(u,E)
          # Use actual call site lower loop with source anchor resolved by independent native call above.
          # Sweep both directions, with one ordinary intervening card or mismatch/barrier.
          bound2=[]
          pool=list(itertools.product((0,1),(0,1,2),(1,2),(0,1,2)))
          ranges=[(0x1c7b274,0x1c7b784),(0x2b4c7b8,0x2b4c7c0),(0x3b40e44,0x3b40e48),(0x38b4f94,0x38b4f98),(0x1c8c8a8,0x1c8c8ac)]
          for pos,near,far in itertools.product(range(3),pool,[(1,1,1,0),(1,1,1,1),(1,1,1,2),(1,1,2,2)]):
           items=[near,far];items.insert(pos,(1,1,1,0))
           u=setup(ranges);found,aid=anchor(u,items,pos)
           expected=None
           for i in range(pos,-1,-1):
            avail,kind,cat,bs=items[i]
            if not avail or kind>1 or cat!=1:break
            if bs:expected=i;break
           assert (found,aid)==(int(expected is not None),0 if expected is None else expected+10),(items,pos,found,aid,expected)
           u=setup(ranges);lookup,idx=world(u,items,pos);args(u,W,pos+10,0)
           def partner(u):wh(u,rr(u,UC_ARM_REG_R2),aid);reg(u,UC_ARM_REG_R0,found)
           def initial(u):reg(u,UC_ARM_REG_R7,pos+10);reg(u,UC_ARM_REG_R1,pos+10);reg(u,UC_ARM_REG_PC,0x1c7b580)
           def cmp2(u):
            reg(u,UC_ARM_REG_R1,rr(u,UC_ARM_REG_R8));reg(u,UC_ARM_REG_R0,rr(u,UC_ARM_REG_SP)+2);reg(u,UC_ARM_REG_PC,0x1c7b738)
           run(u,0x1c7b4d0,STOP,{0x1c7b4e8:0x1c7b538,0x1c7b55c:initial,0x1c7b5e0:skipread(UC_ARM_REG_R1,UC_ARM_REG_R5,0x1c7b5f8),0x1c7b62c:0x1c7b64c,0x1c7b690:skipread(UC_ARM_REG_R1,UC_ARM_REG_R5,0x1c7b6a4),0x1c7b6b8:skipread(UC_ARM_REG_R1,UC_ARM_REG_R4,0x1c7b6d0),0x1c7b700:lambda u:(wh(u,rr(u,UC_ARM_REG_SP)+2,half(u,rr(u,UC_ARM_REG_R0))),cmp2(u))},{0x2b4c7bc:lookup,0x1c8c8a8:partner,0x2b4c7b8:G,0x3b40e44:idx,0x38b4f94:compare},count=800)
           ex=0
           if expected is not None:ex=1 if items[expected][3]==1 else 3
           else:
            for av,k,c,bs in items[pos+1:]:
             if not av or k>1:break
             if bs:ex=2 if bs==1 else 4;break
             if c!=1:break
           got=rr(u,UC_ARM_REG_R0);assert got==ex,(items,pos,got,ex)
           bound2.append([items,pos,found,aid,got])
          print('BOUND29',json.dumps(bound2,separators=(',',':')))
          mag=[]
          for common,kind,baseTag,tag,order,required in itertools.product((0,1),range(5),(0,2),(0,2,3),(0,1,2,9),(-1,0,1,2,9)):
           a=0x1c9d250;b=0x1c9d2dc
           u=setup([(a,b),(0x1d34a14,0x1d34a24),(0x1d3100c,0x1d3101c),(0x1c967bc,0x1c967c0)])
           # Puzzle getter is kind-based? determine source truth with separate actual getter run before comparison
           wb(u,C+20,kind);wh(u,C+6,baseTag);wb(u,E+20,0 if order==0 else 1);wh(u,E+6,tag);wh(u,E+8,order)
           args(u,C,0);run(u,0x1d34a14,STOP);puz=rr(u,UC_ARM_REG_R0)
           u=setup([(a,b),(0x1d34a14,0x1d34a24),(0x1d3100c,0x1d3101c),(0x1c967bc,0x1c967c0)])
           wb(u,C+20,kind);wh(u,C+6,baseTag);wb(u,E+20,0 if order==0 else 1);wh(u,E+6,tag);wh(u,E+8,order)
           args(u,C,E,1,required);run(u,a,STOP,calls={0x1c967bc:common})
           ex=int(common and (order==0 if required==0 else order==required if required>0 else (not puz or baseTag!=0 and baseTag==tag)))
           got=rr(u,UC_ARM_REG_R0);assert got==ex,(common,kind,baseTag,tag,order,required,puz,got,ex);mag.append([common,kind,baseTag,tag,order,required,puz,got])
          print('MAGTARGET29',json.dumps(mag,separators=(',',':')))
          writes=[]
          for state,sc in itertools.product(range(3),range(2)):
           u=setup([(0x1c7a164,0x1c7a17c)]);wb(u,C+0x18,sc);wb(u,E+0x17,state);args(u,C);reg(u,UC_ARM_REG_R7,E);run(u,0x1c7a164,0x1c7a17c);cut=[byte(u,C+0x18),byte(u,E+0x17)];assert cut==[0,1]
           u=setup([(0x1c7a2a0,0x1c7a2ac)]);wb(u,E+0x17,state);args(u,E);run(u,0x1c7a2a0,0x1c7a2ac);un=byte(u,E+0x17);assert un==0
           u=setup([(0x1c7a454,0x1c7a45c)]);wb(u,C+0x18,sc);args(u,C);run(u,0x1c7a454,0x1c7a45c);ds=byte(u,C+0x18);assert ds==0
           writes.append([state,sc,*cut,un,ds])
          print('CUT29',json.dumps(writes,separators=(',',':')))
          ice=[]
          for lay in (1,2,3,99):
           u=setup([(0x1c80d88,0x1c80db4),(0x1d32be4,0x1d32bf4)]);wb(u,C+0x19,lay);args(u,C);reg(u,UC_ARM_REG_R11,W);run(u,0x1c80d88,0x1c80db4,stops=(0x1c80e2c,));new=byte(u,C+0x19);ev=2 if rr(u,UC_ARM_REG_PC)==0x1c80e2c else 1;assert (new,ev)==(lay-1,2 if lay==1 else 1);ice.append([lay,new,ev])
          print('MELT29',json.dumps(ice))
          puzzle=[]
          for cat,order,m1,f1,m2,f2,old,flags in itertools.product((1,55),(0,3),(8,9),(0,2),(8,9),(0,2),(8,9),(0,1,2,3)):
           u=setup([(0x1c98128,0x1c981b4)]);wr(u,W+0x28,L);wh(u,L+8,9);wh(u,C,cat);wh(u,C+0x12,m1);wb(u,C+0x15,f1);wh(u,E+0x12,m2);wb(u,E+0x15,f2);wh(u,G,100);wh(u,G+6,42);wh(u,G+0x12,old);wb(u,G+0x15,flags)
           args(u,G);reg(u,UC_ARM_REG_R7,C);reg(u,UC_ARM_REG_R9,E);reg(u,UC_ARM_REG_R8,W);reg(u,UC_ARM_REG_R10,order);run(u,0x1c98128,0x1c981b4)
           got=[half(u,G),half(u,G+6),half(u,G+8),byte(u,G+0x14),half(u,G+0x12),byte(u,G+0x15)]
           moved=(m1==9 and f1&2) or (m2==9 and f2&2)
           ex=[cat,0,order,1,9 if moved else old,(flags|2 if old==9 else 2) if moved else flags];assert got==ex,(got,ex);puzzle.append([cat,order,m1,f1,m2,f2,old,flags,*got])
