             threshold=f32(total*rv);cum=0.
             for i,x in enumerate(w):
              cum=f32(cum+x)
              if threshold<=cum and not flags[i]:expected=i;break
            if expected<0:expected=next((i for i,x in enumerate(flags) if not x),-1)
            assert ret==expected,(w,flags,rv,ret,expected)
            assert len(calls)==(1 if total>0 else 0)
            pickrows.append([w,flags,rv,ret,len(calls)])
          print('PICK22',json.dumps(pickrows,separators=(',',':')))
          # Native mark operation: synthetic value arrays with initialized metadata.
          # Resume after metadata guard and bind only its class pointer, no scoring
          # or marking logic stubbed.
          marks=[]
          for x in ins(0x1c84914,0x1c84944):print('MARK_ALU23',hex(x.address),x.mnemonic,x.op_str)
          for lens in ([1],[5],[2,4]):
