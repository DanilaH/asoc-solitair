name: Signed Android release
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full SHA accepted for this candidate
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      VITE_ASOC_PROFILE: c8-release-v1
      ASOC_AD_MODE: live
      ASOC_APK_VARIANT: release
      ASOC_OWNER_ADS_READY: ${{ vars.ASOC_OWNER_ADS_READY }}
      ASOC_OWNER_LIVES_ADS_READY: ${{ vars.ASOC_OWNER_LIVES_ADS_READY }}
      ASOC_REWARD_OFFERS_ADS_READY: ${{ vars.ASOC_REWARD_OFFERS_ADS_READY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore the accepted pinned dependency cache without writing private source back
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.npm
          key: node-cache-Linux-x64-npm-a4df24577ed48de6d871f0577006637c44d25e4ee405b275d4a7b579b77d534b
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: node --test tests/infrastructure/*.test.mjs
      - run: node tools/install-dependencies.mjs
        env:
          MINI_GAMES_KIT_READ_TOKEN: ${{ secrets.MINI_GAMES_KIT_READ_TOKEN }}
          ASOC_KIT_OFFLINE_CACHE: '1'
      - name: Check production prerequisites without exposing their values
        env:
          ASOC_STORE_BASE64: ${{ secrets.ASOC_STORE_BASE64 }}
          ASOC_STORE_PASSWORD: ${{ secrets.ASOC_STORE_PASSWORD }}
          ASOC_KEY_ALIAS: ${{ secrets.ASOC_KEY_ALIAS }}
          ASOC_KEY_PASSWORD: ${{ secrets.ASOC_KEY_PASSWORD }}
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.YANDEX_INTERSTITIAL_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY }}
          ASOC_OWNER_ADS_READY: ${{ vars.ASOC_OWNER_ADS_READY }}
          ASOC_OWNER_LIVES_ADS_READY: ${{ vars.ASOC_OWNER_LIVES_ADS_READY }}
          ASOC_REWARD_OFFERS_ADS_READY: ${{ vars.ASOC_REWARD_OFFERS_ADS_READY }}
        run: node tools/qa/release-readiness.mjs --require

      - name: Verify accepted source identity
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Verify historical contracts in their ordinary baseline
        run: env -u VITE_ASOC_PROFILE npm run check
      - name: Verify current Rules4, M1 and save contracts
        run: npx vitest run tests/unit/campaign-meta.test.ts tests/unit/e4-m1.test.ts tests/unit/functional-audit-225.test.ts --testTimeout=30000
      - run: npm run android:sync
      - name: Build using configured signing identity
        env:
          YANDEX_BANNER_AD_UNIT_ID: ${{ secrets.YANDEX_BANNER_AD_UNIT_ID }}
          YANDEX_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.YANDEX_INTERSTITIAL_AD_UNIT_ID }}
          YANDEX_REWARDED_AD_UNIT_ID: ${{ secrets.YANDEX_REWARDED_AD_UNIT_ID }}
          APPMETRICA_API_KEY: ${{ secrets.APPMETRICA_API_KEY }}
          STORE_BASE64: ${{ secrets.ASOC_STORE_BASE64 }}
          ASOC_STORE_PASSWORD: ${{ secrets.ASOC_STORE_PASSWORD }}
          ASOC_KEY_ALIAS: ${{ secrets.ASOC_KEY_ALIAS }}
          ASOC_KEY_PASSWORD: ${{ secrets.ASOC_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$STORE_BASE64" && test -n "$ASOC_STORE_PASSWORD" && test -n "$ASOC_KEY_ALIAS" && test -n "$ASOC_KEY_PASSWORD"
          export ASOC_STORE_FILE="$RUNNER_TEMP/asoc-release.jks"
          trap 'rm -f "$ASOC_STORE_FILE"' EXIT
          printf '%s' "$STORE_BASE64" | base64 --decode > "$ASOC_STORE_FILE"
          cd native/android
          ./gradlew --no-daemon assembleRelease bundleRelease
      - run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs native/android/app/build/outputs/apk/release/app-release.apk
          python3 tools/qa/verify-release-apk.py native/android/app/build/outputs/apk/release/app-release.apk
          python3 tools/qa/verify-release-apk.py native/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -J-Duser.language=en -verify native/android/app/build/outputs/bundle/release/app-release.aab | tee .recording/aab-signature.txt
          grep -q "jar verified." .recording/aab-signature.txt
          sha256sum native/android/app/build/outputs/apk/release/app-release.apk native/android/app/build/outputs/bundle/release/app-release.aab > .recording/production-SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: asoc-solitair-signed
          path: |
            .recording/production-SHA256SUMS
            .recording/release-readiness.json
            dist/release-manifest.json
            native/android/app/build/outputs/apk/release/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
            native/android/app/build/outputs/mapping/release/
          retention-days: 7
