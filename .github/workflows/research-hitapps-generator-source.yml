name: Isolated Unico signed candidate research
on:
  pull_request:
    branches: [research/hitapps-commerce-native-20261127]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify signed candidate and inspect ARM64 native catalog
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --location --silent --show-error --retry 1 --max-time 120 'https://d.apkpure.net/b/XAPK/com.unicostudio.wordsolitaire?version=latest' -o "$tmp/source.xapk"
          python3 -m pip install --quiet --disable-pip-version-check 'capstone==5.0.6' 'unicorn==2.1.4'
          python3 - "$tmp/source.xapk" <<'PY'
          import hashlib, io, json, re, struct, sys, zipfile, subprocess, shutil, tempfile
          from pathlib import Path
          
          XAPK_SHA="4cd372b97d14711bcd4dfbb3188919fdd6a98b86ec0645163c28424bc08113f7"
          EXPECTED_SIGNER_SHA1="0845180dd90924929c7f688ac2e115b17354456d"
          PKG="com.unicostudio.wordsolitaire"
          KEYS=("Magnet","Daily","Coffee","Game","Level","Hint","Booster",
                "Stock","Deck","Move","Victory","Failure","Offer","Purchase",
                "Reward","Event","Fortune","Tournament","Card","Ad","Shuffle",
                "Analytics","Play","Currency","Store","Joker","Undo")
          def checksum_file(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(4<<20),b''):h.update(chunk)
              return h.hexdigest()
          def checksum(raw):return hashlib.sha256(raw).hexdigest()
          def validate_original_candidate(path):
              assert checksum_file(path)==XAPK_SHA,"PUBLIC candidate SHA mismatch; refuse different version"
              with zipfile.ZipFile(path) as outer:
                  mf=json.loads(outer.read("manifest.json"))
                  assert mf.get("package_name")==PKG
                  assert str(mf.get("version_code"))=="37" and mf.get("version_name")=="1.1.10"
                  inner=[x for x in outer.infolist() if x.filename.endswith(".apk") and "/" not in x.filename]
                  assert len(inner)==2,[(x.filename,x.file_size) for x in inner]
                  apks={}
                  apksigner=shutil.which("apksigner")
                  if not apksigner:
                      # GitHub runner usually has Android SDK; use versioned build-tools.
                      import os
                      sdk=Path(os.environ.get("ANDROID_HOME","/opt/android-sdk"))
                      paths=sorted((sdk/"build-tools").glob("*/apksigner"),reverse=True)
                      apksigner=str(paths[0]) if paths else None
                  assert apksigner and Path(apksigner).exists(),"apksigner required; no false signature claims"
                  with tempfile.TemporaryDirectory() as wd:
                      for item in inner:
                          output=Path(wd)/Path(item.filename).name
                          with outer.open(item) as source, output.open("wb") as dest:
                              shutil.copyfileobj(source,dest,4<<20)
                          command=[str(apksigner),"verify","--print-certs","--min-sdk-version","27",str(output)]
                          res=subprocess.run(command,capture_output=True,text=True,timeout=110)
                          assert res.returncode==0,"Cryptographic APK signature verification failed"
                          m=re.search(r"Signer #1 certificate SHA-1 digest:\s*([0-9a-f:]+)",res.stdout,re.I)
                          assert m and m.group(1).replace(":","").lower()==EXPECTED_SIGNER_SHA1,"Signer differs from independent third-party certificate claim"
                          apks[item.filename]={"sha256":checksum_file(output),"bytes":output.stat().st_size}
                          with zipfile.ZipFile(output) as inside:
                              found_meta=[x for x in inside.namelist() if x.endswith("global-metadata.dat")]
                              found_arm64=[x for x in inside.namelist() if x.endswith("libil2cpp.so") and "arm64" in x]
                              if found_meta:
                                  assert len(found_meta)==1
                                  apks[item.filename]["metadata"]=inside.read(found_meta[0])
                              if found_arm64:
                                  assert len(found_arm64)==1
                                  apks[item.filename]["native"]=inside.read(found_arm64[0])
              md=[x["metadata"] for x in apks.values() if "metadata" in x]
              elf=[x["native"] for x in apks.values() if "native" in x]
              assert len(md)==1 and len(elf)==1
              return (md[0],elf[0],{k:{u:v for u,v in val.items() if u not in ("metadata","native")} for k,val in apks.items()})
          
          md,e,parts=validate_original_candidate(Path(sys.argv[1]))
          print('IDENTITY',json.dumps({'xapk':XAPK_SHA,'signerSha1':EXPECTED_SIGNER_SHA1,'parts':parts,'metadata':checksum(md),'elf':checksum(e),'metadataVersion':struct.unpack_from('<I',md,4)[0]},separators=(',',':')))
          assert e[:6]==b'\x7fELF\x02\x01' and struct.unpack_from('<H',e,18)[0]==183
          assert struct.unpack_from('<I',md)[0]==0xfab11baf
          version=struct.unpack_from('<I',md,4)[0]
          ph=struct.unpack_from('<Q',e,32)[0];ps,pn=struct.unpack_from('<HH',e,54)
          seg=[]
          for i in range(pn):
           typ,flags,fo,va,_,fs,ms,al=struct.unpack_from('<II6Q',e,ph+i*ps)
           if typ==1:seg.append((fo,va,fs,flags))
          def off(va,n=1):
           for fo,v,s,f in seg:
            if v<=va and va+n<=v+s:return fo+va-v
           raise ValueError(hex(va))
          def va(fo):
           for o,v,s,f in seg:
            if o<=fo<o+s:return v+fo-o
           raise ValueError(hex(fo))
          def ex(a):
           return any(v<=a<v+s and f&1 for o,v,s,f in seg)
          sh=struct.unpack_from('<Q',e,40)[0];ss,sn,si=struct.unpack_from('<HHH',e,58)
          sec=[struct.unpack_from('<II4QII2Q',e,sh+i*ss) for i in range(sn)]
          rel={}
          for row in sec:
           if row[1]!=4 or row[9]!=24:continue
           for p in range(row[4],row[4]+row[5],24):
            dst,info,addend=struct.unpack_from('<QQq',e,p)
            if (info&0xffffffff)==1027:rel[dst]=addend
          def ptr(a):
           return rel.get(a,struct.unpack_from('<Q',e,off(a,8))[0])
          print('ELF_LAYOUT',json.dumps({'segments':seg,'relativeRelocs':len(rel),'metadataVersion':version}))
          if version not in (29,31):
           print('UNSUPPORTED_METADATA',version);sys.exit(0)
          S,SS=struct.unpack_from('<II',md,24);M,MS=struct.unpack_from('<II',md,48)
          T,TS=struct.unpack_from('<II',md,160);I,IS=struct.unpack_from('<II',md,168)
          F,FS=struct.unpack_from('<II',md,96);P,PS=struct.unpack_from('<II',md,88)
          assert TS%88==0 and MS%36==0 and IS%40==0 and S+SS<=len(md)
          def name(i):
           if not 0<=i<SS:return ''
           p=S+i;return md[p:md.index(b'\0',p,S+SS)].decode(errors='replace')
          pattern=re.compile(r'Magnet|Daily|Fortune|Coffee|Streak|Theme|Skin|FailOffer|HardOffer|StarterOffer|VIP|DoubleReward|WinReward|LevelGenerator|LevelManager|LevelController|GameController|GameManager|Rewarded|Interstitial|AdBreak|AdsManager|AdManager|Shuffle|NoMoves|OutOfMoves|Redeal|Retry|TaskManager|Tournament|Season|OfferManager|OfferController|ShopManager',re.I)
          ignore=re.compile(r'^Unity|^System|^Microsoft|^Mono|^mscorlib|^Newtonsoft|^Google|^Facebook|^Firebase|^Adjust|^AppsFlyer|^DG\.|^TMPro|^Sirenix|^Cysharp|^UniTask|^UniRx|^MaxSdk|^Amazon|^I2\.|^AppLovin|^Android|^Apple|^IronSource',re.I)
          images={};wanted={}
          for j in range(IS//40):
           ir=struct.unpack_from('<10I',md,I+40*j);im=name(ir[0]);images[im]=ir
           if ignore.search(im):continue
           for t in range(ir[2],ir[2]+ir[3]):
            tr=struct.unpack_from('<22I',md,T+88*t)
            tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
            if ignore.search(tn):continue
            count=tr[16]&65535
            if tr[9]+count>MS//36:continue
            methods=[]
            for idx in range(tr[9],tr[9]+count):
             mr=struct.unpack_from('<7I4H',md,M+36*idx);mn=name(mr[0])
             methods.append((mn,mr))
            if pattern.search(tn) or any(pattern.search(mn) for mn,mr in methods):
             wanted.setdefault(im,[]).append((tn,tr,methods))
          print('IMAGES',json.dumps({im:len(t) for im,t in wanted.items()}))
          entries={};records=[];modules={}
          # Module names may live in read-only data, direct pointers or relative relocations.
          revrel={}
          for a,b in rel.items():revrel.setdefault(b,[]).append(a)
          for im,types in wanted.items():
           ir=images[im];possible=set();marker=im.encode()+b'\0';start=0
           while True:
            p=e.find(marker,start);start=p+1
            if p<0:break
            if p and e[p-1]!=0:continue
            try:addr=va(p)
            except ValueError:continue
            possible.update(revrel.get(addr,[]))
            packed=struct.pack('<Q',addr)
            for o,v,s,f in seg:
             if f&1:continue
             j=-1;blob=e[o:o+s]
             while (j:=blob.find(packed,j+1))>=0:
              if (v+j)%8==0:possible.add(v+j)
           found=[]
           maxrid=0
           for t in range(ir[2],ir[2]+ir[3]):
            tr=struct.unpack_from('<22I',md,T+88*t)
            for idx in range(tr[9],tr[9]+(tr[16]&65535)):
             mr=struct.unpack_from('<7I4H',md,M+36*idx);maxrid=max(maxrid,mr[6]&0xffffff)
           for a in possible:
            try:
             n=struct.unpack_from('<I',e,off(a+8,4))[0];p=ptr(a+16)
             if not 0<n<100000 or n<maxrid or n>maxrid+100:continue
             off(p,n*8);pset=[ptr(p+8*i) for i in range(n)]
             if all(v==0 or ex(v) for v in pset) and any(pset):found.append((a,n,p,pset))
            except (ValueError,struct.error):continue
           if len(found)!=1:
            print('MODULE_UNRESOLVED',json.dumps({'image':im,'candidates':len(possible),'valid':len(found),'maxTokenRid':maxrid}))
            pset=[]
           else:
            a,n,p,pset=found[0];modules[im]={'descriptor':hex(a),'count':n,'table':hex(p)}
            for t in range(ir[2],ir[2]+ir[3]):
             tr=struct.unpack_from('<22I',md,T+88*t);tn='.'.join(filter(None,(name(tr[1]),name(tr[0]))))
             for idx in range(tr[9],tr[9]+(tr[16]&65535)):
              mr=struct.unpack_from('<7I4H',md,M+36*idx);rid=mr[6]&0xffffff
              if 0<rid<=len(pset) and pset[rid-1]:entries.setdefault(pset[rid-1],[]).append(tn+'.'+name(mr[0]))
           for tn,tr,methods in types:
            fields=[name(struct.unpack_from('<I',md,F+12*idx)[0]) for idx in range(tr[8],tr[8]+(tr[17]&65535)) if 0<=idx<FS//12]
            mm=[]
            for mn,mr in methods:
             rid=mr[6]&0xffffff;a=pset[rid-1] if 0<rid<=len(pset) else 0
             params=[name(struct.unpack_from('<I',md,P+12*(mr[4]+i))[0]) for i in range(mr[-1]) if 0<=mr[4]+i<PS//12]
             mm.append([mn,hex(a),params])
             if a and (pattern.search(tn) or pattern.search(mn)):records.append((im,tn,mn,a,params))
            print('U_TYPE',json.dumps({'image':im,'type':tn,'fields':fields,'methods':mm},separators=(',',':')))
          print('MODULES',json.dumps(modules))
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          import bisect
          d=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          starts=sorted(entries)
          deep=re.compile(r'Magnet|Daily|Fortune|Coffee|Streak|Theme|FailOffer|DoubleReward|WinReward|LevelGenerator|LevelController|Rewarded|Interstitial|AdBreak|Shuffle|NoMoves|OutOfMoves|Retry|Tournament|Season',re.I)
          for im,tn,mn,a,params in records:
           if not deep.search(tn+'.'+mn) or re.search(r'Analytics|Editor|Test|Debug|Formatter|Serializer|ViewModel|Animation|Localization',tn,re.I):continue
           if mn.startswith(('add_','remove_','set_')):continue
           k=bisect.bisect_right(starts,a)
           if k>=len(starts):continue
           b=starts[k]
           if not 4<=b-a<=0x1800:continue
           ins=list(d.disasm(e[off(a,b-a):off(a,b-a)+b-a],a))
           calls=[[hex(x.address),x.op_str,entries.get(int(x.op_str[1:],16),[])[:3]] for x in ins if x.mnemonic in ('bl','b') and re.fullmatch(r'#0x[0-9a-f]+',x.op_str) and entries.get(int(x.op_str[1:],16))]
           print('U_METHOD',json.dumps({'type':tn,'method':mn,'a':hex(a),'b':hex(b),'parameters':params,'calls':calls},separators=(',',':')))
           if (deep.search(tn) and len(ins)<=160 and re.search(r'Can|Is|Get|Calculate|Select|Apply|Add|Claim|Reset|Reward|Move|Try|Count|Update|Complete|Shuffle|Start|End|Check|Find|Activate|Process|On',mn,re.I)):
            facts=[[hex(x.address),x.mnemonic,x.op_str] for x in ins if x.mnemonic.startswith(('b','cb','tb','cmp','cmn','tst','cset','csel','ldr','str','ldp','stp','mov','add','sub','mul','f','sdiv','udiv','and','orr','eor','lsl','lsr','asr','ret'))]
            print('U_FOCUS',json.dumps({'type':tn,'method':mn,'a':hex(a),'b':hex(b),'facts':facts,'calls':calls},separators=(',',':')))
          print('PASS_UNICO_CANDIDATE_CATALOG',len(modules),len(records))
          PY
